:root {
  --grund:      #f1e7d2;
  --grund-tief: #e5d8bd;
  --karte:      #faf3e3;
  --karte-hoch: #fffbf0;
  --tinte:      #241a10;
  --tinte-matt: #6e6250;
  --linie:      #d6c5a0;
  --linie-zart: #e6d9bd;
  --gold:       #9a7618;
  --gold-matt:  #c1a44c;
  --rot:        #7d1414;
  --rot-matt:   #b56a6a;
  --jagd:       #2c5437;
  --bronze:     #8a5a2b;

  --band:       #16301e;
  --band-tinte: #efe2c4;
  --band-gold:  #c9a227;

  --ap:          #a9762a;
  --coups:       #2f5673;
  --ideen:       #5c3a63;
  --segnungen:   #7a7157;
  --ambition:    #96522c;
  --rage:        #8f2626;
  --quintessenz: #3d3a70;
  --lep:         #7d1414;
  --wuerfel:     #2c5437;

  --tipphoehe: 52px;
  --rand: 14px;
  --schatten: 0 1px 2px rgba(36,26,16,.10), 0 6px 18px rgba(36,26,16,.07);
  --textur: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='0.045'/></svg>");
}

html[data-modus="dunkel"] {
  --grund:      #101a12;
  --grund-tief: #0b120d;
  --karte:      #17251a;
  --karte-hoch: #1d2f21;
  --tinte:      #ece0c8;
  --tinte-matt: #a2977f;
  --linie:      #33472f;
  --linie-zart: #253524;
  --gold:       #c9a227;
  --gold-matt:  #9a7f2c;
  --rot:        #b83c3c;
  --rot-matt:   #8a3a3a;
  --jagd:       #6fa87a;
  --bronze:     #b07f4a;

  --ap:          #d8a244;
  --coups:       #6a9dcd;
  --ideen:       #ab84ae;
  --segnungen:   #b6ae95;
  --ambition:    #cf8354;
  --rage:        #d15656;
  --quintessenz: #8f8ddc;
  --lep:         #c04545;
  --wuerfel:     #79b184;

  --schatten: 0 1px 2px rgba(0,0,0,.55), 0 8px 22px rgba(0,0,0,.4);
  --textur: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='0.05'/></svg>");
}

html[data-zierrat="schlicht"] { --textur: none; }
html[data-zierrat="schlicht"] .ecke,
html[data-zierrat="schlicht"] .kopfstueck,
html[data-zierrat="schlicht"] .schlussstueck,
html[data-zierrat="schlicht"] .zl-mitte,
html[data-zierrat="schlicht"] .kopf-unter .orn { display: none; }
html[data-zierrat="schlicht"] body { font-size: 19.5px; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body { margin: 0; padding: 0; }

body {
  min-height: 100dvh;
  background: var(--grund-tief);
  color: var(--tinte);
  font-family: 'Jaegerbuch', "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
  font-size: 18px;
  line-height: 1.45;
  font-variant-numeric: lining-nums proportional-nums;
  overscroll-behavior-y: none;
  -webkit-text-size-adjust: 100%;
}

button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; }

.res-zahl, .h-wuerfel, .fert-sum, .lep-feld, .stufe-knopf, .waehler .wert,
.kartusche .gross, .wurf-zahl, .gross-zahl, .h-ap, .attr-reihe .val,
.wert-reihe .val, .fert-fw, input[type="number"] {
  font-variant-numeric: lining-nums tabular-nums;
}

.orn { display: inline-flex; align-items: center; justify-content: center;
       width: 1em; height: 1em; flex: 0 0 auto; }
.orn svg { width: 100%; height: 100%; display: block; }
.h-name .besitz .orn { width: 15px; height: 15px; vertical-align: -2px; }
.kaestchen .orn { width: 22px; height: 22px; }
.wahl-zeichen .orn { width: 19px; height: 19px; }
.fert .kaestchen .orn { width: 18px; height: 18px; }

.zierleiste { display: flex; align-items: center; gap: 10px; margin: 18px 0; color: var(--gold); }
.zierleiste.schmal { margin: 12px 0; }
.zl-linie {
  flex: 1 1 auto; height: 3px;
  background:
    linear-gradient(90deg, transparent, currentColor 45%, currentColor 55%, transparent) top/100% 1px no-repeat,
    linear-gradient(90deg, transparent, currentColor 30%, currentColor 70%, transparent) bottom/100% 1px no-repeat;
  opacity: .5;
}
.zl-mitte { width: 17px; height: 17px; flex: 0 0 auto; opacity: .85; }

.kopfstueck { color: var(--gold); opacity: .55; margin: 2px 0 10px; }
.kopfstueck svg { width: 100%; height: 20px; }
.schlussstueck { color: var(--gold); opacity: .45; margin: 8px 0 4px; text-align: center; }
.schlussstueck svg { width: 130px; height: 20px; }

.app {
  max-width: 780px; margin: 0 auto; min-height: 100dvh;
  display: flex; flex-direction: column;
  background: var(--grund); background-image: var(--textur);
  position: relative;
}
@media (min-width: 820px) {
  .app { box-shadow: 0 0 0 1px var(--linie), 0 0 60px rgba(0,0,0,.22); }
}

.kopfleiste {
  position: sticky; top: 0; z-index: 40;
  background: var(--band);
  background-image:
    radial-gradient(ellipse at 50% -45%, rgba(201,162,39,.18), transparent 62%),
    var(--textur);
  color: var(--band-tinte);
  padding: max(6px, env(safe-area-inset-top)) 10px 0;
  box-shadow: 0 6px 16px rgba(0,0,0,.22);
}
.kopf-reihe { display: flex; align-items: center; gap: 8px; }
.kopf-knopf {
  flex: 0 0 auto; width: 46px; height: 46px;
  display: grid; place-items: center;
  border: 1px solid rgba(201,162,39,.42); border-radius: 3px;
  color: var(--band-gold); background: rgba(0,0,0,.16);
}
.kopf-knopf:active { background: rgba(201,162,39,.16); }
.kopf-knopf[disabled] { opacity: .3; }
.kopf-knopf svg { width: 21px; height: 21px; }

.kopf-mitte { flex: 1 1 auto; min-width: 0; text-align: center; padding: 2px 0; }
.kopf-name {
  font-size: 21px; font-weight: 700; line-height: 1.05;
  font-variant-caps: small-caps; letter-spacing: .045em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.kopf-unter {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  font-size: 12.5px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--band-gold); margin-top: 3px; opacity: .92;
  white-space: nowrap; overflow: hidden;
}
.kopf-unter .orn { width: 9px; height: 9px; opacity: .85; }

.kolumnentitel {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 4px 8px; margin-top: 6px;
  border-top: 1px solid rgba(201,162,39,.28);
  font-size: 12px; letter-spacing: .24em; text-transform: uppercase;
  color: rgba(239,226,196,.7);
}
.kolumnentitel::before, .kolumnentitel::after {
  content: ""; flex: 1 1 auto; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(201,162,39,.45), transparent);
}

main { flex: 1 1 auto; padding: 10px 8px calc(100px + env(safe-area-inset-bottom)); }
.seite { display: none; }
.seite.aktiv { display: block; animation: auf .2s ease-out; }
@keyframes auf { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }

.karte {
  position: relative;
  background: var(--karte); background-image: var(--textur);
  border: 1px solid var(--linie); border-radius: 3px;
  box-shadow: var(--schatten);
  padding: 13px 14px 15px; margin-bottom: 16px;
}
.karte.prunk { padding: 18px; border-color: var(--gold-matt); }
.karte.rot   { border-top: 2px solid var(--rot); }
.karte.gruen { border-top: 2px solid var(--jagd); }
.karte.gold  { border-top: 2px solid var(--gold); }

.ecke { position: absolute; width: 30px; height: 30px; color: var(--gold); opacity: .5; pointer-events: none; }
.ecke svg { width: 100%; height: 100%; }
.ecke.ol { left: 3px; top: 3px; }
.ecke.or { right: 3px; top: 3px; transform: scaleX(-1); }
.ecke.ul { left: 3px; bottom: 3px; transform: scaleY(-1); }
.ecke.ur { right: 3px; bottom: 3px; transform: scale(-1,-1); }

.karte-kopf {
  display: flex; align-items: baseline; gap: 9px;
  margin: 0 0 8px; padding-bottom: 7px;
  border-bottom: 1px solid var(--linie-zart);
  font-size: 14.5px; font-weight: 700;
  font-variant-caps: small-caps; letter-spacing: .1em;
  color: var(--gold);
}
.karte.prunk .karte-kopf {
  justify-content: center; border-bottom: none; padding-bottom: 2px; font-size: 16px;
}
.karte.rot .karte-kopf { color: var(--rot); }
.karte-kopf .nr {
  flex: 0 0 auto; align-self: center;
  width: 21px; height: 21px; border-radius: 50%;
  display: grid; place-items: center; border: 1px solid currentColor;
  font-size: 11.5px; letter-spacing: 0; font-variant-caps: normal;
  font-variant-numeric: lining-nums;
}
.karte-kopf .kt { min-width: 0; }
.karte-kopf .rechts {
  margin-left: auto; letter-spacing: .02em; font-variant-caps: normal;
  font-size: 14px; font-weight: 400; color: var(--tinte-matt);
}
.karte.prunk .karte-kopf .rechts { margin-left: 0; }
.karte-unter { margin: -2px 0 10px; font-size: 14.5px; font-style: italic; color: var(--tinte-matt); }
.karte.prunk .karte-unter { text-align: center; }

.kartusche {
  position: relative;
  margin: 4px auto 12px; padding: 14px 30px 12px;
  max-width: 360px; text-align: center;
  border-top: 1px solid var(--gold-matt); border-bottom: 1px solid var(--gold-matt);
  background: linear-gradient(180deg, rgba(154,118,24,.06), transparent 62%);
}
.kartusche::before, .kartusche::after {
  content: ""; position: absolute; top: 3px; bottom: 3px; width: 1px;
  background: linear-gradient(180deg, transparent, var(--gold-matt) 22%, var(--gold-matt) 78%, transparent);
}
.kartusche::before { left: 8px; }
.kartusche::after  { right: 8px; }
.kartusche .gross { font-size: 66px; font-weight: 700; line-height: .96; color: var(--lep); }
.kartusche.ap .gross    { color: var(--ap); }
.kartusche.gruen .gross { color: var(--wuerfel); }
.kartusche.gold .gross  { color: var(--gold); }
.kartusche .von {
  font-size: 13px; letter-spacing: .17em; text-transform: uppercase;
  color: var(--tinte-matt); margin-top: 5px;
}
.lage {
  display: inline-block; margin-top: 10px; padding: 4px 15px 3px;
  border: 1px solid currentColor; border-radius: 2px;
  font-size: 12.5px; letter-spacing: .16em; text-transform: uppercase; font-weight: 700;
}
.lage-unversehrt { color: var(--jagd); }
.lage-verletzt   { color: var(--ambition); }
.lage-schwer     { color: var(--rot); background: rgba(125,20,20,.09); }

.res { padding: 12px 0; border-bottom: 1px solid var(--linie-zart); }
.res:last-child { border-bottom: none; }
.res-oben { display: flex; align-items: center; gap: 12px; }
.res-titel { flex: 1 1 auto; min-width: 0; }
.res-name { font-size: 18px; font-weight: 700; line-height: 1.2; }
.res-satz { font-size: 14px; color: var(--tinte-matt); margin-top: 5px; }
.res-steuer { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }

.tipp-knopf {
  width: var(--tipphoehe); height: var(--tipphoehe); min-width: var(--tipphoehe);
  border-radius: 50%; display: grid; place-items: center;
  font-size: 25px; font-weight: 700; line-height: 1;
  border: 1px solid var(--linie); background: var(--karte-hoch); color: var(--tinte);
  box-shadow: var(--schatten); transition: transform .07s;
}
.tipp-knopf:active { transform: scale(.93); background: var(--grund-tief); }
.tipp-knopf[disabled] { opacity: .26; box-shadow: none; }

.res-zahl { min-width: 74px; text-align: center; }
.res-zahl .jetzt { font-size: 33px; font-weight: 700; line-height: 1; display: block; }
.res-zahl .von { font-size: 12.5px; color: var(--tinte-matt); display: block; margin-top: 2px; }

.perlen { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
.perle { width: 14px; height: 14px; border-radius: 50%; border: 1px solid var(--linie); background: transparent; }
.perle.voll { background: var(--farbe, var(--gold)); border-color: var(--farbe, var(--gold)); }

.lep-leiste { display: grid; grid-template-columns: repeat(auto-fill, minmax(36px, 1fr)); gap: 4px; margin-top: 8px; }
.lep-feld {
  height: 40px; border-radius: 2px; border: 1px solid var(--linie);
  background: var(--karte-hoch); font-size: 14px;
  display: grid; place-items: center; color: var(--tinte-matt);
}
.lep-feld.gefuellt { background: var(--jagd); border-color: var(--jagd); color: #f4ead4; font-weight: 700; }
html[data-modus="dunkel"] .lep-feld.gefuellt { background: rgba(111,168,122,.2); color: var(--jagd); border-color: var(--jagd); }
.lep-feld.minus { border-style: dashed; }
.lep-feld.minus.gefuellt { background: var(--lep); border-color: var(--lep); color: #f6ecd8; }
.lep-feld.jetzt { outline: 2px solid var(--gold); outline-offset: 1px; }
.lep-feld[data-lepwert="-11"] { border-color: var(--rot); color: var(--rot); font-weight: 700; }

.kaestchen-reihe { display: flex; flex-wrap: wrap; gap: 9px; align-items: center; margin-top: 8px; }
.kaestchen {
  width: 48px; height: 48px; border-radius: 2px;
  border: 1px solid var(--tinte-matt); background: var(--karte-hoch);
  display: grid; place-items: center; font-size: 21px; color: var(--rot);
}
.kaestchen.weg { background: var(--grund-tief); border-color: var(--rot-matt); }

.handlung {
  display: flex; align-items: center; gap: 12px; width: 100%;
  padding: 10px 6px; border-bottom: 1px solid var(--linie-zart);
  text-align: left; min-height: var(--tipphoehe);
}
.handlung:last-child { border-bottom: none; }
.handlung:active { background: var(--grund-tief); }
.handlung[disabled] { opacity: .38; }
.h-wuerfel {
  flex: 0 0 auto; width: 48px; height: 48px; border-radius: 3px;
  background: var(--jagd); color: #f4ead4;
  display: grid; place-items: center; font-size: 24px; font-weight: 700; line-height: 1;
}
html[data-modus="dunkel"] .h-wuerfel { background: rgba(111,168,122,.15); color: var(--jagd); box-shadow: inset 0 0 0 1px var(--jagd); }
.h-wuerfel.leer { background: transparent; color: var(--tinte-matt); border: 1px dashed var(--linie); box-shadow: none; }
.h-text { flex: 1 1 auto; min-width: 0; }
.h-name { display: block; font-size: 17px; font-weight: 700; line-height: 1.2; }
.h-name .besitz { color: var(--gold); margin-right: 5px; }
.h-unter { display: block; font-size: 13.5px; color: var(--tinte-matt); margin-top: 2px; }
.h-was { display: block; font-size: 14px; line-height: 1.35; margin-top: 3px; font-style: italic; }
.h-kosten { flex: 0 0 auto; text-align: right; }
.h-ap {
  display: inline-block; padding: 3px 10px 2px; border-radius: 2px;
  border: 1px solid currentColor; color: var(--ap); font-size: 13.5px; font-weight: 700;
}
.h-ap.frei { color: var(--tinte-matt); }

.einfluss { padding: 12px 0; border-bottom: 1px solid var(--linie-zart); }
.einfluss:last-child { border-bottom: none; }
.einfluss-kopf { display: flex; align-items: baseline; gap: 9px; }
.einfluss-name { font-size: 17.5px; font-weight: 700; flex: 1 1 auto; }
.einfluss-wirkung { font-size: 13.5px; color: var(--tinte-matt); margin: 3px 0 9px; }
.stufen { display: flex; gap: 6px; }
.stufe-knopf {
  flex: 1 1 0; height: 50px; border-radius: 2px;
  border: 1px solid var(--linie); background: var(--karte-hoch);
  font-size: 16px; font-weight: 700; color: var(--tinte-matt);
}
.stufe-knopf.an { background: var(--rot); border-color: var(--rot); color: #f6ecd8; }
.stufe-knopf.null.an {
  background: transparent; border-color: var(--jagd); color: var(--jagd);
  box-shadow: inset 0 0 0 1px var(--jagd);
}
.stufe-knopf:active { transform: scale(.95); }

.knopf {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; width: 100%; min-height: var(--tipphoehe);
  padding: 11px 14px; border-radius: 3px;
  border: 1px solid var(--linie); background: var(--karte-hoch);
  font-size: 17px; font-weight: 700; text-align: center;
  box-shadow: var(--schatten);
}
.knopf:active { transform: translateY(1px); }
.knopf .unter { font-size: 13px; font-weight: 400; opacity: .8; }
.knopf[disabled] { opacity: .38; box-shadow: none; }
.knopf.schmal { min-height: 50px; font-size: 16px; padding: 9px 12px; }

.knopf.haupt {
  background: var(--band); border-color: var(--band-gold); color: var(--band-tinte);
  box-shadow: inset 0 0 0 1px rgba(201,162,39,.3), var(--schatten);
  font-variant-caps: small-caps; letter-spacing: .05em; font-size: 19.5px;
}
.knopf.haupt .unter { color: rgba(239,226,196,.8); font-variant-caps: normal; letter-spacing: 0; }
.knopf.warn  { border-color: var(--rot);  color: var(--rot);
  box-shadow: inset 0 0 0 1px rgba(125,20,20,.22), var(--schatten); }
.knopf.gruen { border-color: var(--jagd); color: var(--jagd);
  box-shadow: inset 0 0 0 1px rgba(44,84,55,.22), var(--schatten); }
.knopf.warn .unter, .knopf.gruen .unter { color: var(--tinte-matt); }
.knopf-reihe { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.knopf-spalte { display: grid; gap: 10px; }

.knopf.kaffee {
  flex-direction: row; gap: 12px; text-align: left;
  border-color: var(--gold); color: var(--tinte);
  box-shadow: inset 0 0 0 1px rgba(201,162,39,.28), var(--schatten);
}
.knopf.kaffee .kaffee-bild { width: 30px; height: 30px; flex: 0 0 auto; color: var(--gold); }
.knopf.kaffee .kaffee-txt { display: flex; flex-direction: column; gap: 2px;
  font-variant-caps: small-caps; letter-spacing: .04em; }
.knopf.kaffee .unter { font-variant-caps: normal; letter-spacing: 0; color: var(--tinte-matt); }
html[data-zierrat="schlicht"] .knopf.kaffee .kaffee-bild { display: none; }

.reiter {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 45;
  display: grid; grid-template-columns: repeat(5, 1fr);
  max-width: 780px; margin: 0 auto;
  background: var(--band); background-image: var(--textur);
  border-top: 1px solid rgba(201,162,39,.4);
  padding-bottom: env(safe-area-inset-bottom);
  box-shadow: 0 -6px 18px rgba(0,0,0,.25);
}
.reiter-knopf {
  min-height: 60px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  color: rgba(239,226,196,.6);
  font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase;
  padding: 7px 2px; border-top: 2px solid transparent;
}
.reiter-knopf svg { width: 22px; height: 22px; }
.reiter-knopf.aktiv { color: var(--band-gold); border-top-color: var(--band-gold); background: rgba(0,0,0,.22); }

.blatt-hg { position: fixed; inset: 0; z-index: 60; background: rgba(8,14,9,.62); display: none; align-items: flex-end; justify-content: center; }
.blatt-hg.offen { display: flex; }
.blatt {
  width: 100%; max-width: 780px; max-height: 90dvh; overflow-y: auto;
  background: var(--grund); background-image: var(--textur);
  border-top: 2px solid var(--gold); border-radius: 6px 6px 0 0;
  padding: 8px 16px calc(20px + env(safe-area-inset-bottom));
  box-shadow: 0 -10px 44px rgba(0,0,0,.5);
  animation: hoch .22s ease-out;
}
@keyframes hoch { from { transform: translateY(28px); opacity: .5; } to { transform: none; opacity: 1; } }
.blatt-griff { width: 46px; height: 3px; border-radius: 2px; background: var(--linie); margin: 5px auto 12px; }
.blatt h2 {
  margin: 0 0 4px; font-size: 24px; color: var(--tinte);
  font-variant-caps: small-caps; letter-spacing: .03em; text-align: center;
}
.blatt .untertitel { font-size: 14.5px; color: var(--tinte-matt); font-style: italic; text-align: center; margin-bottom: 2px; }

.wurf {
  text-align: center; padding: 16px 12px 12px;
  border-top: 1px solid var(--gold-matt); border-bottom: 1px solid var(--gold-matt);
  background: linear-gradient(180deg, rgba(154,118,24,.06), transparent 65%);
  margin: 12px 0 14px;
}
.wurf-zahl { font-size: 62px; font-weight: 700; line-height: 1; color: var(--wuerfel); }
.wurf.blut { border-color: var(--rot-matt); background: linear-gradient(180deg, rgba(125,20,20,.07), transparent 65%); }
.wurf.blut .wurf-zahl { color: var(--rot); }
.wurf-was { font-size: 13px; letter-spacing: .18em; text-transform: uppercase; color: var(--tinte-matt); margin-top: 5px; }
.wurf-mod { font-size: 14.5px; margin-top: 9px; }
.wurf-mod .plus { color: var(--jagd); font-weight: 700; }
.wurf-mod .minus { color: var(--rot); font-weight: 700; }

.feld { margin-bottom: 12px; }
.feld label {
  display: block; font-size: 13.5px; letter-spacing: .12em;
  font-variant-caps: small-caps; color: var(--tinte-matt); margin-bottom: 5px;
}
.feld input, .feld select, .feld textarea {
  width: 100%; min-height: 50px; padding: 10px 12px;
  border: 1px solid var(--linie); border-radius: 2px;
  background: var(--karte-hoch); color: var(--tinte); font-size: 17px;
}
.feld textarea { min-height: 84px; resize: vertical; }
.feld-reihe { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px,1fr)); gap: 10px; }

.waehler { display: flex; align-items: center; justify-content: center; gap: 16px; margin: 4px 0 14px; }
.waehler .wert { font-size: 42px; font-weight: 700; min-width: 74px; text-align: center; }

.begriff { border-bottom: 1px dotted var(--gold); color: inherit; padding: 0 1px; font: inherit; }
.begriff::after { content: "\00a0*"; font-size: .8em; color: var(--gold); vertical-align: super; }

.tipp-blase {
  position: fixed; z-index: 80; max-width: 330px;
  background: var(--band); color: var(--band-tinte);
  border: 1px solid var(--band-gold); border-radius: 3px;
  padding: 11px 14px; font-size: 15px; line-height: 1.4;
  box-shadow: 0 10px 34px rgba(0,0,0,.45); display: none;
}
.tipp-blase.offen { display: block; }
.tipp-blase b {
  color: var(--band-gold); display: block; margin-bottom: 4px;
  font-variant-caps: small-caps; letter-spacing: .05em; font-size: 16.5px;
}

.wahl {
  display: flex; align-items: center; gap: 13px; width: 100%; text-align: left;
  min-height: var(--tipphoehe); padding: 12px;
  border: 1px solid var(--linie); border-radius: 2px;
  background: var(--karte-hoch); margin-bottom: 10px;
}
.wahl:active { background: var(--grund-tief); }
.wahl.gewaehlt { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); }
.wahl-text { flex: 1 1 auto; min-width: 0; }
.wahl-titel { display: block; font-size: 17px; font-weight: 700; }
.wahl-unter { display: block; font-size: 13.5px; color: var(--tinte-matt); margin-top: 2px; }
.wahl-zeichen { flex: 0 0 auto; font-size: 21px; color: var(--gold); width: 24px; text-align: center; }
.wahl-kasten {
  display: grid; place-items: center; width: 22px; height: 22px;
  border: 1px solid var(--linie); border-radius: 2px; color: var(--gold);
}
.wahl.gewaehlt .wahl-kasten { border-color: var(--gold); }
.wahl-kasten .orn { width: 15px; height: 15px; }

.meldung {
  position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom));
  transform: translateX(-50%); z-index: 70;
  background: var(--band); color: var(--band-tinte);
  border: 1px solid var(--band-gold); border-radius: 3px;
  padding: 11px 20px; font-size: 15.5px;
  box-shadow: 0 8px 30px rgba(0,0,0,.45);
  opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s;
  max-width: 90vw; text-align: center;
}
.meldung.zeigen { opacity: 1; transform: translateX(-50%) translateY(-5px); }
.blatt-hg.offen ~ .meldung { bottom: auto; top: calc(14px + env(safe-area-inset-top)); }
.blatt-hg.offen ~ .meldung.zeigen { transform: translateX(-50%) translateY(5px); }

.hinweisfeld {
  background: linear-gradient(90deg, rgba(154,118,24,.09), transparent);
  border-left: 2px solid var(--gold); border-radius: 0 2px 2px 0;
  padding: 10px 13px; font-size: 14.5px; color: var(--tinte-matt); margin: 12px 0;
}
.hinweisfeld b { color: var(--tinte); }
.hinweisfeld.blut { background: linear-gradient(90deg, rgba(125,20,20,.10), transparent); border-left-color: var(--rot); }
.leerhinweis { text-align: center; color: var(--tinte-matt); font-style: italic; padding: 26px 10px; }
.klein { font-size: 13.5px; color: var(--tinte-matt); }
.mitte { text-align: center; }
.reihe-zwischen { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

.fert { display: flex; align-items: center; gap: 10px; padding: 9px 2px; border-bottom: 1px solid var(--linie-zart); min-height: 48px; }
.fert:last-child { border-bottom: none; }
.fert-name { flex: 1 1 auto; font-size: 16.5px; }
.fert-name span { display: block; font-size: 13px; color: var(--tinte-matt); font-style: italic; }
.fert-fw { flex: 0 0 auto; width: 32px; text-align: center; font-size: 15px; color: var(--tinte-matt); }
.fert-attr {
  flex: 0 0 auto; width: 46px; text-align: center; font-size: 12.5px;
  color: var(--tinte-matt); border: 1px solid var(--linie); border-radius: 2px; padding: 3px 0;
  font-variant-caps: small-caps; letter-spacing: .05em;
}
.fert-sum {
  flex: 0 0 auto; width: 46px; height: 40px; border-radius: 3px;
  background: var(--jagd); color: #f4ead4;
  display: grid; place-items: center; font-size: 19px; font-weight: 700;
}
html[data-modus="dunkel"] .fert-sum { background: rgba(111,168,122,.15); color: var(--jagd); box-shadow: inset 0 0 0 1px var(--jagd); }

.schritte { display: flex; gap: 5px; margin-bottom: 14px; }
.schritt-punkt { flex: 1 1 0; height: 3px; background: var(--linie); }
.schritt-punkt.an { background: var(--gold); }
.schritt-punkt.fertig { background: var(--jagd); }

.gross-zahl { font-size: 46px; font-weight: 700; line-height: 1; text-align: center; }
.gross-zahl.rot { color: var(--rot); }

.attr-reihe { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; text-align: center; }
.attr-reihe .lbl { font-size: 12.5px; font-variant-caps: small-caps; letter-spacing: .08em; color: var(--tinte-matt); }
.attr-reihe .val { font-size: 25px; font-weight: 700; color: var(--rot); }
.wert-reihe { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px 6px; text-align: center; }
.wert-reihe .lbl { font-size: 12.5px; font-variant-caps: small-caps; letter-spacing: .06em; color: var(--tinte-matt); }
.wert-reihe .val { font-size: 22px; font-weight: 700; }

@media (min-width: 640px) {
  :root { --rand: 20px; }
  main > .seite { padding: 18px 16px 0; }
  .knopf-reihe.drei { grid-template-columns: repeat(3, 1fr); }
}

@media print { .reiter, .kopfleiste, .blatt-hg, .meldung { display: none !important; } }

.titelblatt {
  position: fixed; inset: 0; z-index: 90;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: var(--grund); background-image: var(--textur);

}

  --damast: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='84' height='84'><g fill='none' stroke='%23c9a227' stroke-width='1' opacity='0.07'><path d='M42 8 C 32 20 23 25 23 36 C 23 45 32 50 42 41 C 52 50 61 45 61 36 C 61 25 52 20 42 8 Z'/><path d='M42 41 V 78'/><path d='M42 58 C 34 58 28 64 28 73'/><path d='M42 58 C 50 58 56 64 56 73'/><path d='M0 36 C 6 31 13 31 19 36'/><path d='M65 36 C 71 31 78 31 84 36'/><path d='M0 78 C 8 70 14 70 21 76'/><path d='M84 78 C 76 70 70 70 63 76'/></g></svg>");
}
html[data-zierrat="schlicht"] { --damast: none; }

.app { background-image: var(--damast), var(--textur); }
.kopfleiste {
  background-image:

    var(--damast), var(--textur);
}
.reiter { background-image: var(--damast), var(--textur); }

main { position: relative; }
main::before {
  content: ""; position: absolute; pointer-events: none;
  left: 3px; right: 3px; top: 3px;
  bottom: calc(90px + env(safe-area-inset-bottom));
  border: 1.4px solid var(--gold-matt); opacity: .45;
}
main::after {
  content: ""; position: absolute; pointer-events: none;

  border: 1px solid var(--gold-matt); opacity: .26;
}
html[data-zierrat="schlicht"] main::before,
html[data-zierrat="schlicht"] main::after { display: none; }
main > .seite { position: relative; padding: 13px 11px 0; }

.ecke.zart { width: 20px; height: 20px; opacity: .3; }
.karte { padding: 15px 16px 16px; }

.bandleiste {
  height: 9px; margin: -2px 0 9px;
  color: var(--gold);
  background-color: currentColor;
  opacity: .38;
  -webkit-mask-image: var(--band-muster); mask-image: var(--band-muster);
  -webkit-mask-repeat: repeat-x; mask-repeat: repeat-x;
  -webkit-mask-size: auto 9px; mask-size: auto 9px;
}
:root {
  --band-muster: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='60' height='14' viewBox='0 0 60 14'><g fill='none' stroke='%23000' stroke-width='1.4' stroke-linecap='round'><path d='M0 7 C 6 7 8 3 14 3 C 20 3 22 11 28 11 C 34 11 36 3 42 3 C 48 3 50 7 56 7 H 60'/></g></svg>");
}
html[data-zierrat="schlicht"] .bandleiste { display: none; }

.kartusche { padding: 18px 34px 15px; }
.kecke { position: absolute; width: 17px; height: 17px; color: var(--gold); opacity: .7; pointer-events: none; }
.kecke svg { width: 100%; height: 100%; }
.kecke.ol { left: 2px; top: 2px; }
.kecke.or { right: 2px; top: 2px; transform: scaleX(-1); }
.kecke.ul { left: 2px; bottom: 2px; transform: scaleY(-1); }
.kecke.ur { right: 2px; bottom: 2px; transform: scale(-1,-1); }
html[data-zierrat="schlicht"] .kecke { display: none; }

.kopf-wappen {

}

.reiter { border-top: 2px solid var(--band-gold); }
.reiter::before {
  content: ""; position: absolute; left: 0; right: 0; top: 2px; height: 1px;
  background: rgba(201,162,39,.3);
}

.karte.prunk .karte-unter.initiale::first-letter {
  float: left; font-size: 46px; line-height: .84;
  padding: 4px 8px 0 0; color: var(--gold);
  font-weight: 700; font-style: normal;
}

.tb-rahmen { padding: 30px 22px 26px; }

.spielhinweis {

}

.kasse-stand {
  text-align: center; padding: 6px 0 14px;

}

  font-size: 52px; font-weight: 700; line-height: 1; color: var(--gold);

}

.ks-waehrung {
  font-size: 14px; font-variant-caps: small-caps; letter-spacing: .14em;
  color: var(--tinte-matt);
}

.buchungen { margin-bottom: 10px; }
.buchung {
  display: flex; align-items: center; gap: 11px;
  padding: 9px 2px; border-bottom: 1px solid var(--linie-zart);
  min-height: 48px;
}
.buchung:last-child { border-bottom: none; }

}

.bu-grund span { display: block; font-size: 12.5px; color: var(--tinte-matt); margin-top: 1px; }

  padding: 8px 13px; border: 1px solid var(--linie); border-radius: 2px;

}

.merkzettel-kopf {

}

  font-size: 12.5px; font-variant-caps: small-caps; letter-spacing: .1em;

}

}

#druckbogen { display: none; }

@media print {
  @page { size: A4 portrait; margin: 7mm; }
  html, body { background: #fff !important; margin: 0 !important; padding: 0 !important; }
  .app, .reiter, .blatt-hg, .meldung, .tipp-blase, .titelblatt { display: none !important; }

function baueMali(stufe) {
  const c = JSON.parse(JSON.stringify(MALI_BASIS));
  c.stufe = stufe;
  const notizen = [];
  for (let s = 3; s <= stufe; s++) {
    const auf = MALI_AUFSTIEGE[s];
    if (!auf) continue;
    if (auf.lepMax) c.lepMax = auf.lepMax;
    if (auf.attribute) Object.assign(c.attribute, auf.attribute);
    if (auf.fertigkeiten) {
      for (const [n, fw] of Object.entries(auf.fertigkeiten)) {
        const f = c.fertigkeiten.find(x => x.name === n);
        if (f) f.fw = fw;
      }
    }
    if (auf.waffen) {
      for (const [n, fw] of Object.entries(auf.waffen)) {
        const w = c.waffen.find(x => x.name === n);
        if (w) w.fw = fw;
      }
    }
    notizen.push('Stufe ' + s + ': ' + auf.notiz);
  }
  c.coupsBasis = c.attribute.ath;
  c.ideenBasis = c.attribute.wis + 1;          // +1 durch Motivation „Neugierig“
  c.kraefte = c.kraefte.filter(k => k.abStufe <= stufe);
  c.aufstiegsnotizen = notizen;
  c.id = 'mali-' + stufe;

  const hammer = summe(c, c.waffen.find(x => x.name === 'Schlagwaffen'));
  c.spieltipps = [
    stufe >= 3
      ? '**Kriegshammer**: **' + hammer + ' Würfel**, mit „Weiter Schwung“ +2 Schaden.'
      : '**Kriegshammer** ist deine beste Waffe: **' + hammer + ' Würfel**.',
    stufe >= 4
      ? 'Deine **' + c.ideenBasis + ' Ideen**: erst **Heilige Aura** auf den, der vorn steht.'
      : 'Deine **' + c.ideenBasis + ' Ideen** sind Gold wert — gib sie für die Freunde aus.',
    stufe >= 5
      ? '**Feuer und Stahl**: schon 2 Erfolge räumen einen Bande-1-Gegner ab.'
      : 'Bei Höllenviehzeug: erst **Worte des Herrn**, dann draufhauen.'
  ];
  c.pufferHinweis = stufe < 4
    ? 'Puffer-Lep bekommt Mali erst auf Stufe 4.'
    : 'Puffer-Lep kommen von der Heiligen Aura — 4 Stück zu Kampfbeginn. Sie verfallen am Kampfende.';
  if (notizen.length) {
    c.herkunft = 'Original-Werte (US81064) + Aufstiege laut „Malis Entwicklung“ · ' +
                 notizen.join(' · ');
  }
  return c;
}

function zierleiste(schmal) {
  return '<div class="zierleiste' + (schmal ? ' schmal' : '') + '">' +
         '<i class="zl-linie"></i>' + orn('fleuron', 'zl-mitte') + '<i class="zl-linie"></i>' +
         '</div>';
}

function kopfstueck() {
  return '<div class="kopfstueck">' + ORNAMENT.kopfstueck + '</div>';
}

function schlussstueck() {
  return '<div class="schlussstueck">' + ORNAMENT.schlussstueck + '</div>';
}

function ecken(klasse) {
  return ['ol', 'or', 'ul', 'ur']
    .map(p => '<i class="ecke ' + p + (klasse ? ' ' + klasse : '') + '">' + ORNAMENT.ecke + '</i>').join('');
}

function kartuschenecken() {
  return ['ol', 'or', 'ul', 'ur']
    .map(p => '<i class="kecke ' + p + '">' + ORNAMENT.kartuschenecke + '</i>').join('');
}

function kartusche(zahl, unter, ton, lage) {
  return '<div class="kartusche' + (ton ? ' ' + ton : '') + '">' +
         kartuschenecken() +
         '<div class="gross">' + zahl + '</div>' +
         '<div class="von">' + unter + '</div>' +
         (lage || '') +
         '</div>';
}

function karte(opt) {
  const k = opt || {};
  const klassen = ['karte'];
  if (k.prunk) klassen.push('prunk');
  if (k.ton) klassen.push(k.ton);
  let h = '<section class="' + klassen.join(' ') + '">';
  h += ecken(k.prunk ? '' : 'zart');
  if (k.titel) {
    h += '<h2 class="karte-kopf">';
    if (k.nr) h += '<span class="nr">' + k.nr + '</span>';
    h += '<span class="kt">' + k.titel + '</span>';
    if (k.rechts) h += '<span class="rechts">' + k.rechts + '</span>';
    h += '</h2>';
    h += k.prunk ? kopfstueck() : '<div class="bandleiste"></div>';
  }
  if (k.unter) h += '<p class="karte-unter">' + k.unter + '</p>';
  h += k.inhalt || '';
  h += '</section>';
  return h;
}

const SPEICHERKEY = 'jaegerbuch.v1';

function neuerZustand(c) {
  return {
    ap: c.apBasis,
    coups: c.coupsBasis,
    ideen: c.ideenBasis,
    segnungen: 0,
    ambition: 0,
    rage: 0,
    quintessenz: 0,
    lep: c.lepMax,
    puffer: 0,
    ersteHilfeGenutzt: 0,
    magHeilungGenutzt: 0,
    einfluss: { aussen: 0, innen: 0, malus: 0, laehmung: 0 },
    runde: 1,
    imKampf: false,
    vorteileGenutzt: {},
    quintDieseRunde: false,
    buchungen: (c.geldStart ? [{ t: Date.now(), b: c.geldStart, g: 'Startgeld' }] : []),
    merkzettel: '',
    logbuch: []
  };
}

function zustandErgaenzen(c, z) {
  if (!Array.isArray(z.buchungen)) z.buchungen = [];
  if (!z.buchungen.length && c.geldStart) {
    z.buchungen = [{ t: Date.now(), b: c.geldStart, g: 'Startgeld' }];
  }
  if (typeof z.merkzettel !== 'string') z.merkzettel = '';
  if (!Array.isArray(z.logbuch)) z.logbuch = [];
  return z;
}

const BOGEN_FASSUNG = 2;

const NACHZURUESTEN = [
  'person', 'motivation', 'spieltipps', 'ausruestung', 'ausruestungHinweis',
  'herkunft', 'quelle', 'ideenKurz', 'pufferHinweis',
  'geldStart', 'unterhalt', 'waehrung'
];

function charakterErgaenzen(c) {
  if (!c) return c;

  if (c.vorlage === 'mali' && typeof baueMali === 'function') {
    let vorlage = null;
    try { vorlage = baueMali(c.stufe || 2); } catch (e) { vorlage = null; }
    if (vorlage) {
      NACHZURUESTEN.forEach(f => {
        const leer = c[f] === undefined || c[f] === null ||
                     (Array.isArray(c[f]) && c[f].length === 0);
        if (leer && vorlage[f] !== undefined) {
          c[f] = JSON.parse(JSON.stringify(vorlage[f]));
        }
      });
      (c.kraefte || []).forEach(k => {
        const v = (vorlage.kraefte || []).find(x => x.name === k.name);
        if (!v) return;
        ['label', 'kurz', 'text'].forEach(f => { if (!k[f] && v[f]) k[f] = v[f]; });
      });
    }
  }

  if (!Array.isArray(c.ausruestung)) c.ausruestung = [];
  if (!Array.isArray(c.person)) c.person = [];
  if (!Array.isArray(c.spieltipps)) c.spieltipps = [];
  if (!Array.isArray(c.aufstiegsnotizen)) c.aufstiegsnotizen = [];
  if (typeof c.waehrung !== 'string' || !c.waehrung) c.waehrung = 'Gulden';
  if (typeof c.geldStart !== 'number') c.geldStart = 0;
  if (typeof c.unterhalt !== 'number') c.unterhalt = 0;
  if (typeof c.motivation !== 'string') c.motivation = '';
  if (typeof c.spielhinweis !== 'string') c.spielhinweis = '';

  c.fassung = BOGEN_FASSUNG;
  return c;
}

function alleErgaenzen() {
  (Buch.charaktere || []).forEach(charakterErgaenzen);
}

let Buch = {
  charaktere: [],
  zustaende: {},
  aktiv: null,
  einstellungen: { modus: 'dunkel', ersterStart: true }
};

let RueckStapel = [];
const RUECK_MAX = 60;

function speichern() {
  try {
    localStorage.setItem(SPEICHERKEY, JSON.stringify(Buch));
    return true;
  } catch (e) {
    return false;
  }
}

function laden() {
  try {
    const roh = localStorage.getItem(SPEICHERKEY);
    if (!roh) return false;
    const daten = JSON.parse(roh);
    if (!daten || !Array.isArray(daten.charaktere)) return false;
    Buch = Object.assign(Buch, daten);
    alleErgaenzen();
    return true;
  } catch (e) {
    return false;
  }
}

function speicherVerfuegbar() {
  try {
    const p = '__jb_test__';
    localStorage.setItem(p, '1');
    localStorage.removeItem(p);
    return true;
  } catch (e) {
    return false;
  }
}

function charakter() {
  const c = Buch.charaktere.find(x => x.id === Buch.aktiv) || null;
  if (c && c.fassung !== BOGEN_FASSUNG) charakterErgaenzen(c);
  return c;
}
function zustand() {
  if (!Buch.aktiv) return null;
  const c = charakter();
  if (!c) return null;
  if (!Buch.zustaende[Buch.aktiv]) Buch.zustaende[Buch.aktiv] = neuerZustand(c);
  return zustandErgaenzen(c, Buch.zustaende[Buch.aktiv]);
}

function merken(was) {
  const z = zustand();
  if (!z) return;
  RueckStapel.push({
    id: Buch.aktiv,
    was: was || 'Änderung',
    stand: JSON.parse(JSON.stringify(z))
  });
  if (RueckStapel.length > RUECK_MAX) RueckStapel.shift();
}

function zurueck() {
  const letzter = RueckStapel.pop();
  if (!letzter) { melden('Nichts zum Rückgängigmachen.'); return false; }
  Buch.zustaende[letzter.id] = letzter.stand;
  if (Buch.aktiv !== letzter.id) Buch.aktiv = letzter.id;
  speichern();
  zeichnen();
  melden('Rückgängig: ' + letzter.was);
  return true;
}

function aendern(was, fn) {
  merken(was);
  fn(zustand(), charakter());
  speichern();
  zeichnen();
}

function apMax(c, z) {
  return Math.max(0, c.apBasis - z.einfluss.laehmung);
}

function resMax(c, z, id) {
  const r = REGELN.ressourcen.find(x => x.id === id);
  if (!r) return 0;
  if (r.maxFest) return r.maxFest;
  if (id === 'ap') return apMax(c, z);
  if (id === 'coups') return c.coupsBasis + (r.ueberladung || 0);
  if (id === 'ideen') return c.ideenBasis + (r.ueberladung || 0);
  return 0;
}

function resGrund(c, z, id) {
  if (id === 'ap') return apMax(c, z);
  if (id === 'coups') return c.coupsBasis;
  if (id === 'ideen') return c.ideenBasis;
  return 0;
}

function summe(c, eintrag) {
  return (eintrag.fw || 0) + (c.attribute[eintrag.attr] || 0);
}

function probenMalus(z) {
  return z.einfluss.malus;
}

function lepLage(z) {
  if (z.lep <= REGELN.lep.schwerVerletztAb) return REGELN.lep.schwellen[2];
  if (z.lep <= REGELN.lep.verletztAb) return REGELN.lep.schwellen[1];
  return REGELN.lep.schwellen[0];
}
function istVerletzt(z) { return z.lep <= REGELN.lep.verletztAb; }
function istSchwerVerletzt(z) { return z.lep <= REGELN.lep.schwerVerletztAb; }

function schadenVerrechnen(c, z, roh, artId) {
  const art = REGELN.schadensarten.find(a => a.id === artId) || REGELN.schadensarten[0];
  let rest = Math.max(0, roh);
  const bericht = { roh: roh, panzer: 0, puffer: 0, lep: 0, art: art.name };

  if (art.panzerHilft && c.panzerwert) {
    bericht.panzer = Math.min(rest, c.panzerwert);
    rest -= bericht.panzer;
  }
  if (art.pufferHilft && z.puffer > 0) {
    bericht.puffer = Math.min(rest, z.puffer);
    z.puffer -= bericht.puffer;
    rest -= bericht.puffer;
  }
  bericht.lep = rest;
  z.lep -= rest;

  if (istVerletzt(z) && z.puffer > 0) {
    bericht.pufferVerfallen = z.puffer;
    z.puffer = 0;
  }
  return bericht;
}

function pufferGeben(z, anzahl) {
  if (istVerletzt(z)) return { erlaubt: false, grund: 'Ab −1 Lebenspunkten kannst du keine Puffer mehr aufbauen.' };
  z.puffer = Math.min(REGELN.lep.pufferMax, z.puffer + anzahl);
  return { erlaubt: true };
}

function apKosten(c, z, handlung, rabattAn) {
  let kosten = handlung.ap || 0;
  if (rabattAn && handlung.rabattMoeglich) {
    kosten = Math.max(1, kosten - handlung.rabattMoeglich.apRabatt);
  }
  return kosten;
}

function rabattMoeglich(c, z, handlung) {
  if (!c.vorteile || !c.vorteile.length) return null;
  for (const v of c.vorteile) {
    if (!v.apRabatt) continue;
    if (v.proKampf && z.vorteileGenutzt[v.id]) continue;
    const passt = v.gilt.some(g => {
      if (g === 'nah') return handlung.art === 'nah';
      if (g === 'fern-schleuder') return handlung.name === 'Schleuder';
      return false;
    });
    if (passt && (handlung.ap || 0) > 1) return v;
  }
  return null;
}

function ini0Dauerschaden(z) {
  let summe = 0;
  const teile = [];
  for (const e of REGELN.einfluesse) {
    if (e.art !== 'lep') continue;
    const stufen = z.einfluss[e.id];
    if (stufen > 0) {
      const s = stufen * e.schadenProStufe;
      summe += s;
      teile.push({ name: e.name, stufen: stufen, schaden: s });
    }
  }
  return { summe: summe, teile: teile };
}

function offeneEinfluesse(z) {
  return REGELN.einfluesse.filter(e => z.einfluss[e.id] > 0);
}

function apAuffuellen(c, z) {
  z.ap = apMax(c, z);
  z.quintDieseRunde = false;
}

function nachKampf(c, z) {
  z.coups = c.coupsBasis;
  z.ideen = c.ideenBasis;
  z.ap = apMax(c, z);
  z.puffer = 0;                      // Puffer-Lep verfallen am Kampfende
  z.vorteileGenutzt = {};
  z.imKampf = false;
  z.runde = 1;
  z.quintDieseRunde = false;
  if (istSchwerVerletzt(z)) z.lep = REGELN.lep.nachKampfAuf;
}

function nachtruhe(c, z, lepZurueck) {
  z.ersteHilfeGenutzt = 0;
  z.magHeilungGenutzt = 0;
  z.lep = Math.min(c.lepMax, z.lep + (lepZurueck || 0));
  z.coups = c.coupsBasis;
  z.ideen = c.ideenBasis;
  z.ap = apMax(c, z);
  z.puffer = 0;
  z.vorteileGenutzt = {};
  z.imKampf = false;
  z.runde = 1;
}

function handlungsliste(c, z) {
  const liste = [];

  (c.waffen || []).forEach((w, i) => {
    const wuerfel = summe(c, w);
    liste.push({
      schluessel: 'w' + i,
      gruppe: w.art === 'verteidigung' ? 'wehren' : 'angriff',
      name: w.name,
      gegenstand: w.gegenstand || '',
      besitz: w.besitz,
      art: w.art,
      ap: w.ap,
      schaden: w.schaden,
      wuerfel: wuerfel,
      fw: w.fw,
      attr: w.attr,
      hinweis: w.hinweis || '',
      probe: true
    });
  });

  (c.kraefte || []).forEach((k, i) => {
    let wuerfel = null;
    if (k.probeFertigkeit) {
      const f = (c.fertigkeiten || []).find(x => x.name === k.probeFertigkeit);
      if (f) wuerfel = summe(c, f);
    }
    liste.push({
      schluessel: 'k' + i,
      gruppe: 'kraft',
      name: k.name,
      art: 'kraft',
      ap: k.ap || 0,
      wuerfel: wuerfel,
      kosten: k.kosten || null,
      puffer: k.puffer || 0,
      kurz: k.kurz || '',
      hinweis: k.text || '',
      probe: !!k.probeFertigkeit,
      espritkraft: !!k.espritkraft,
      kampfbeginn: !!k.kampfbeginn
    });
  });

  REGELN.standardhandlungen.forEach(h => {
    liste.push({
      schluessel: 's' + h.id,
      gruppe: 'standard',
      name: h.name,
      art: h.art,
      ap: h.ap,
      wuerfel: null,
      hinweis: h.satz,
      probe: false,
      standardId: h.id
    });
  });

  liste.forEach(h => { h.rabattMoeglich = rabattMoeglich(c, z, h); });
  return liste;
}

function schadenAusteilen(erfolge, grundschaden, zielPanzer) {
  return Math.max(0, (erfolge || 0) + (grundschaden || 0) - (zielPanzer || 0));
}

function kassenstand(z) {
  return (z.buchungen || []).reduce((s, b) => s + b.b, 0);
}

function geldText(betrag) {
  const gerundet = Math.round(betrag * 100) / 100;
  return gerundet.toLocaleString('de-DE', { maximumFractionDigits: 2 });
}

function buchen(z, betrag, grund) {
  z.buchungen = z.buchungen || [];
  z.buchungen.push({ t: Date.now(), b: betrag, g: grund || (betrag < 0 ? 'Ausgabe' : 'Einnahme') });
}

function notizAnlegen(z, text) {
  z.logbuch = z.logbuch || [];
  z.logbuch.unshift({ t: Date.now(), x: text });
}

function datumText(t) {
  const d = new Date(t);
  return d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: '2-digit' });
}

const KAFFEEKASSE = 'christianjmaass';

function kaffeeLink() {
  return KAFFEEKASSE ? 'https://www.paypal.me/' + encodeURIComponent(KAFFEEKASSE) : '';
}

const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));

function esc(t) {
  return String(t == null ? '' : t)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function begriff(wort, anzeige) {
  const txt = anzeige || wort;
  if (!REGELN.glossar[wort]) return esc(txt);
  return '<button class="begriff" data-begriff="' + esc(wort) + '">' + esc(txt) + '</button>';
}

const SEITEN_TITEL = {
  marker: 'Marker und Vorräte',
  leben: 'Leib und Leben',
  handeln: 'Waffen und Handlungen',
  runde: 'Kampfrunde und Einflüsse',
  buch: 'Das Buch'
};

let AktiveSeite = 'marker';
let MeldungsUhr = null;

function melden(text) {
  const m = $('#meldung');
  m.textContent = text;
  m.classList.add('zeigen');
  clearTimeout(MeldungsUhr);
  MeldungsUhr = setTimeout(() => m.classList.remove('zeigen'), 2400);
}

function tageSeitSicherung() {
  const t = Buch.einstellungen.letzteSicherung;
  if (!t) return null;
  return Math.floor((Date.now() - t) / 86400000);
}

function zeichneKopf() {
  const c = charakter(), z = zustand();
  if (!c) {
    $('#kopfName').textContent = 'Jägerbuch';
    $('#kopfUnter').innerHTML = 'Noch kein Jäger';
    $('#undoKnopf').disabled = true;
  } else {
    $('#kopfName').textContent = c.beiname ? c.name.split(' ')[0] + ' „' + c.beiname + '“' : c.name;
    const mitte = z.imKampf ? 'Stufe ' + c.stufe + ' · Runde ' + z.runde : 'Stufe ' + c.stufe;
    $('#kopfUnter').innerHTML =
      orn('raute') + '<span>' + esc(mitte) + '</span>' + orn('raute');
    $('#undoKnopf').disabled = RueckStapel.length === 0;
  }
  $('#kolumnentitel').textContent = SEITEN_TITEL[AktiveSeite] || '';

function zeichneMarker() {
  const c = charakter(), z = zustand();
  const apM = apMax(c, z);
  let html = '';

  let inhalt = kartusche(z.ap, 'von ' + apM +
      (z.einfluss.laehmung ? ' · Lähmung nimmt ' + z.einfluss.laehmung : ''), 'ap');

  inhalt += '<button class="tipp-knopf" data-res="ap" data-delta="-1"' + (z.ap <= 0 ? ' disabled' : '') + '>−</button>';
  inhalt += '<button class="tipp-knopf" data-res="ap" data-delta="1"' + (z.ap >= apM ? ' disabled' : '') + '>+</button>';
  inhalt += '</div>';
  inhalt += '<div class="hinweisfeld" style="margin-bottom:0">Am Ende jeder Kampfrunde (' +
            begriff('Ini 0') + ') sind sie wieder voll. Das übernimmt der Assistent im Reiter <b>Runde</b>.</div>';

  html += karte({
    prunk: true, nr: 'I', titel: 'Aktionspunkte',
    rechts: z.imKampf ? 'Runde ' + z.runde : 'kein Kampf',
    inhalt: inhalt
  });

  let m = ['coups', 'ideen'].map(id => resZeile(c, z, id)).join('');
  m += zierleiste(true);
  m += '<div class="knopf-reihe">';
  m += '<button class="knopf schmal" data-fokus="coups"' + (z.coups < 1 ? ' disabled' : '') +
       '>Fokussieren<span class="unter">1 Coup · Bonus +3</span></button>';
  m += '<button class="knopf schmal" data-fokus="ideen"' + (z.ideen < 1 ? ' disabled' : '') +
       '>Fokussieren<span class="unter">1 Idee · Bonus +3</span></button>';
  m += '</div>';
  m += '<p class="klein mitte" style="margin:10px 0 0">Coups für Körper-Proben (Kkr, Ath, Ges) · ' +
       'Ideen für Kopf-Proben (Sin, Wis, Wil)</p>';
  html += karte({ nr: 'II', titel: 'Deine Marker', inhalt: m });

  html += karte({
    nr: 'III', titel: 'Verdiente Ressourcen', rechts: 'je höchstens 5',
    inhalt: ['segnungen', 'ambition', 'rage', 'quintessenz'].map(id => resZeile(c, z, id)).join('')
  });

  return html + schlussstueck();
}

function resZeile(c, z, id) {
  const r = REGELN.ressourcen.find(x => x.id === id);
  const max = resMax(c, z, id);
  const wert = z[id];
  const farbe = 'var(--' + id + ')';
  let html = '<div class="res" style="--farbe:' + farbe + '">';
  html += '<div class="res-oben">';
  html += '<div class="res-titel"><div class="res-name">' + begriff(r.name) + '</div>';
  if (max <= 10) {
    html += '<div class="perlen">';
    for (let i = 1; i <= max; i++) html += '<span class="perle' + (i <= wert ? ' voll' : '') + '"></span>';
    html += '</div>';
  }
  html += '</div>';
  html += '<div class="res-steuer">';
  html += '<button class="tipp-knopf" data-res="' + id + '" data-delta="-1"' + (wert <= 0 ? ' disabled' : '') + '>−</button>';
  html += '<div class="res-zahl"><span class="jetzt" style="color:' + farbe + '">' + wert +
          '</span><span class="von">von ' + max + '</span></div>';
  html += '<button class="tipp-knopf" data-res="' + id + '" data-delta="1"' + (wert >= max ? ' disabled' : '') + '>+</button>';
  html += '</div></div>';
  html += '<div class="res-satz">' + esc(r.satz) + '</div>';
  html += '</div>';
  return html;
}

function zeichneLeben() {
  const c = charakter(), z = zustand();
  const lage = lepLage(z);
  const lageKlasse = lage.name === 'unversehrt' ? 'lage-unversehrt'
                   : lage.name === 'verletzt' ? 'lage-verletzt' : 'lage-schwer';
  let html = '';

  let inhalt = kartusche(z.lep, 'von ' + c.lepMax + (z.puffer ? ' · Puffer +' + z.puffer : ''),
      '', '<div class="lage ' + lageKlasse + '">' + esc(lage.name) + '</div>');
  inhalt += '<div class="hinweisfeld' + (lage.name === 'unversehrt' ? '' : ' blut') + '">' + esc(lage.satz) + '</div>';
  inhalt += '<div class="knopf-reihe" style="margin-bottom:10px">';
  inhalt += '<button class="knopf warn" id="trefferKnopf">Treffer<span class="unter">Panzer und Puffer werden verrechnet</span></button>';
  inhalt += '<button class="knopf gruen" id="heilenKnopf">Heilen<span class="unter">Erste Hilfe, Magie, Rage</span></button>';
  inhalt += '</div>';
  inhalt += '<div class="res-steuer" style="justify-content:center;gap:18px">';
  inhalt += '<button class="tipp-knopf" data-lep="-1">−</button>';
  inhalt += '<span class="klein" style="width:96px;text-align:center">von Hand<br>ändern</span>';
  inhalt += '<button class="tipp-knopf" data-lep="1">+</button>';
  inhalt += '</div>';
  inhalt += zierleiste(true);
  inhalt += '<p class="klein mitte" style="margin:0 0 8px">Antippen setzt den Wert — wie das Abstreichen auf dem Bogen</p>';
  inhalt += '<div class="lep-leiste">';
  const zeiger = Math.max(-11, Math.min(c.lepMax, z.lep));
  for (let v = c.lepMax; v >= -11; v--) {
    const kl = ['lep-feld'];
    if (v < 0) kl.push('minus');
    if (v >= 1 && v <= z.lep) kl.push('gefuellt');
    if (v <= -1 && v >= z.lep) kl.push('gefuellt');
    if (v === zeiger) kl.push('jetzt');
    inhalt += '<button class="' + kl.join(' ') + '" data-lepwert="' + v + '">' +
              (v === -11 ? 'X' : v) + '</button>';
  }
  inhalt += '</div>';

  html += karte({
    prunk: true, nr: 'I', titel: 'Lebenspunkte',
    rechts: 'Panzerwert ' + c.panzerwert, inhalt: inhalt
  });

  let p = '<div class="res" style="--farbe:var(--gold)">';
  p += '<div class="res-oben">';
  p += '<div class="res-titel"><div class="res-name">Auf Zeit</div>';
  p += '<div class="perlen">';
  for (let i = 1; i <= REGELN.lep.pufferMax; i++) p += '<span class="perle' + (i <= z.puffer ? ' voll' : '') + '"></span>';
  p += '</div></div>';
  p += '<div class="res-steuer">';
  p += '<button class="tipp-knopf" data-puffer="-1"' + (z.puffer <= 0 ? ' disabled' : '') + '>−</button>';
  p += '<div class="res-zahl"><span class="jetzt" style="color:var(--gold)">' + z.puffer +
       '</span><span class="von">von ' + REGELN.lep.pufferMax + '</span></div>';
  p += '<button class="tipp-knopf" data-puffer="1"' +
       (istVerletzt(z) || z.puffer >= REGELN.lep.pufferMax ? ' disabled' : '') + '>+</button>';
  p += '</div></div>';
  p += '<div class="res-satz">Verfallen am Kampfende. Ab −1 Lebenspunkten nicht mehr aufbaubar.</div>';
  p += '</div>';
  html += karte({ nr: 'II', titel: 'Puffer-Lebenspunkte', inhalt: p });

  let h = kaestchenBlock('Erste Hilfe', c.ersteHilfeMax, z.ersteHilfeGenutzt, 'ersteHilfe', REGELN.heilung.satzErsteHilfe);
  h += '<div style="height:14px"></div>';
  h += kaestchenBlock('Magische Heilung', c.magHeilungMax, z.magHeilungGenutzt, 'magHeilung', REGELN.heilung.satzMagisch);
  h += '<div class="hinweisfeld">' + esc(REGELN.heilung.satzNachtruhe) +
       ' Den Knopf dafür findest du im Reiter <b>Runde</b>.</div>';
  html += karte({ nr: 'III', titel: 'Heilfaktor', inhalt: h });

  return html + schlussstueck();
}

function kaestchenBlock(titel, max, genutzt, schluessel, satz) {
  let html = '<div class="res-name">' + esc(titel) + '</div>';
  html += '<div class="res-satz">' + esc(satz) + '</div>';
  html += '<div class="kaestchen-reihe">';
  for (let i = 1; i <= max; i++) {
    const weg = i <= genutzt;
    html += '<button class="kaestchen' + (weg ? ' weg' : '') + '" data-kaestchen="' + schluessel +
            '" data-nr="' + i + '">' + (weg ? orn('kreuz') : '') + '</button>';
  }
  html += '<span class="klein" style="margin-left:4px">' + (max - genutzt) + ' von ' + max + ' frei</span>';
  html += '</div>';
  return html;
}

function zeichneHandeln() {
  const c = charakter(), z = zustand();
  const liste = handlungsliste(c, z);
  const malus = probenMalus(z);
  let html = '';

  let kopf = kartusche(z.ap, 'Aktionspunkte von ' + apMax(c, z), 'ap');
  kopf += '<button class="knopf haupt" id="rundeFertig">Ini 0 — Runde beenden' +
          '<span class="unter">Dauerschaden, Reduzierungsproben, Aktionspunkte auffüllen</span></button>';
  if (malus > 0) {
    kopf += '<div class="hinweisfeld blut" style="margin-bottom:0"><b>Malus −' + malus +
            '</b> auf alle Proben durch Malusstufen. Bei den Würfelzahlen unten ist er vermerkt.</div>';
  }
  html += karte({ prunk: true, nr: 'I', titel: 'Was du tun kannst', inhalt: kopf });

  const gruppen = [
    { id: 'angriff',  nr: 'II',  titel: 'Womit ich kämpfe', hinweis: 'Antippen zeigt die Würfelzahl und zieht die Aktionspunkte ab.' },
    { id: 'wehren',   nr: 'III', titel: 'Mich wehren',      hinweis: 'Geht auch, wenn du nicht dran bist. Gegen einen Angriff nur einmal.' },
    { id: 'kraft',    nr: 'IV',  titel: 'Meine Jägerkräfte', hinweis: '' },
    { id: 'standard', nr: 'V',   titel: 'Was jeder kann',   hinweis: '' }
  ];

  gruppen.forEach(g => {
    let eintraege = liste.filter(h => h.gruppe === g.id);
    if (g.id === 'angriff') eintraege = eintraege.slice().sort((a, b) => (b.besitz ? 1 : 0) - (a.besitz ? 1 : 0));
    if (!eintraege.length) return;
    html += karte({
      nr: g.nr, titel: g.titel, unter: g.hinweis || null,
      inhalt: eintraege.map(h => handlungsZeile(c, z, h, malus)).join('')
    });
  });

  return html + schlussstueck();
}

function handlungsZeile(c, z, h, malus) {
  const kosten = h.ap || 0;
  const zuTeuer = kosten > z.ap;

  let unter = [];
  if (h.gegenstand) unter.push(h.gegenstand);
  if (h.schaden != null) unter.push('Schaden ' + h.schaden);
  if (h.wuerfel != null && malus > 0) unter.push('Malus −' + malus);
  const beschreibung = h.gruppe === 'kraft' ? (h.kurz || h.hinweis)
                     : (!unter.length ? (h.kurz || h.hinweis) : '');
  const kostenSchonGenannt = /\d+\s*(Coup|Idee)/i.test(beschreibung || '');
  if (h.kosten && !kostenSchonGenannt) for (const [k, v] of Object.entries(h.kosten)) {
    unter.push(v + ' ' + (k === 'coups' ? 'Coup' : 'Idee') + (v > 1 ? 'n' : ''));
  }
  if (h.puffer) unter.push('+' + h.puffer + ' Puffer');

  let html = '<button class="handlung" data-handlung="' + h.schluessel + '"' + (zuTeuer ? ' disabled' : '') + '>';
  html += '<span class="h-wuerfel' + (h.wuerfel == null ? ' leer' : '') + '">' +
          (h.wuerfel != null ? h.wuerfel : '–') + '</span>';
  html += '<span class="h-text"><span class="h-name">' +
          (h.besitz ? '<span class="besitz">' + orn('haken') + '</span>' : '') + esc(h.name) + '</span>';
  if (unter.length) html += '<span class="h-unter">' + esc(unter.join(' · ')) + '</span>';
  if (beschreibung) html += '<span class="h-was">' + esc(beschreibung) + '</span>';
  html += '</span>';
  html += '<span class="h-kosten"><span class="h-ap' + (kosten === 0 ? ' frei' : '') + '">' +
          (kosten === 0 ? 'frei' : kosten + ' Ap') + '</span></span>';
  html += '</button>';
  return html;
}

function zeichneRunde() {
  const c = charakter(), z = zustand();
  let html = '';

  let k = '';
  if (!z.imKampf) {
    k += '<p class="karte-unter initiale">Beim Kampfbeginn füllt das Jägerbuch die ' +
         'Aktionspunkte auf und merkt sich, was einmal pro Kampf geht.</p>';
    k += '<button class="knopf haupt" id="kampfStart">Der Kampf beginnt</button>';
  } else {
    k += kartusche(z.runde, 'Kampfrunde', 'gold');
    k += '<button class="knopf haupt" id="ini0Start">Ini 0 — Runde beenden' +
         '<span class="unter">Dauerschaden, Reduzierungsproben, Aktionspunkte</span></button>';
    k += '<div style="height:10px"></div>';
    k += '<button class="knopf" id="kampfEnde">Der Kampf ist vorbei' +
         '<span class="unter">Coups und Ideen auffüllen, Puffer verfallen</span></button>';
  }
  html += karte({ prunk: true, nr: 'I', titel: 'Kampfrunde',
                  rechts: z.imKampf ? 'Runde ' + z.runde : 'kein Kampf', inhalt: k });

  let e = '';
  REGELN.einfluesse.forEach(x => {
    const stufe = z.einfluss[x.id];
    e += '<div class="einfluss">';
    e += '<div class="einfluss-kopf"><span class="einfluss-name">' + esc(x.name) + '</span>';
    e += '<span class="klein">' + (stufe ? 'Stufe ' + stufe : 'keine') + '</span></div>';
    e += '<div class="einfluss-wirkung">' + esc(x.satz) + '</div>';
    e += '<div class="stufen">';
    e += '<button class="stufe-knopf null' + (stufe === 0 ? ' an' : '') +
         '" data-einfluss="' + x.id + '" data-stufe="0">–</button>';
    for (let s = 1; s <= REGELN.einflussMaxStufe; s++) {
      e += '<button class="stufe-knopf' + (s <= stufe ? ' an' : '') +
           '" data-einfluss="' + x.id + '" data-stufe="' + s + '">' + s + '</button>';
    }
    e += '</div></div>';
  });
  const ds = ini0Dauerschaden(z);
  if (ds.summe > 0) {
    e += '<div class="hinweisfeld blut"><b>Bei Ini 0 kostet dich das ' + ds.summe + ' Lebenspunkte.</b> ' +
         esc(ds.teile.map(t => t.name + ' Stufe ' + t.stufen + ' = ' + t.schaden).join(' · ')) + '</div>';
  }
  if (z.einfluss.laehmung > 0) {
    e += '<div class="hinweisfeld blut"><b>Aktionspunkte: ' + apMax(c, z) + ' statt ' + c.apBasis +
         '</b> — jede Lähmungsstufe nimmt einen weg.</div>';
  }
  html += karte({ nr: 'II', titel: 'Anhaltende Einflüsse',
                  unter: REGELN.glossar['Anhaltende Einflüsse'], inhalt: e });

  let r = '<div class="knopf-spalte">';
  r += '<button class="knopf" id="nachtruheKnopf">Nachtruhe' +
       '<span class="unter">Heilungskästchen wieder frei, 1–4 Lebenspunkte</span></button>';
  r += '<button class="knopf" id="allesZurueck">Alles zurücksetzen' +
       '<span class="unter">Frischer Jäger: volle Werte, keine Einflüsse</span></button>';
  r += '</div>';
  html += karte({ nr: 'III', titel: 'Zwischen den Kämpfen', inhalt: r });

  return html + schlussstueck();
}

const ROEMISCH = ['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'];

  let n = 0;
  const nr = () => ROEMISCH[n++];

    j += '<button class="wahl' + (x.id === Buch.aktiv ? ' gewaehlt' : '') + '" data-jaeger="' + esc(x.id) + '">';
    j += '<span class="wahl-zeichen">' + (x.id === Buch.aktiv ? '●' : '○') + '</span>';

      sp += '<span class="sp-text">' + esc(vorschau) + '</span>';
      sp += '<span class="sp-mehr">ganzen Text lesen</span></button>';

                      ton: 'gold', inhalt: sp });
    }

    let b = '<div class="attr-reihe">';
    ATTRIBUTE.forEach(a => {
      b += '<div><div class="lbl">' + a.kurz + '</div><div class="val">' + c.attribute[a.id] + '</div></div>';
    });
    b += '</div>';
    b += zierleiste(true);
    b += '<div class="wert-reihe">';
    [['Lebenspunkte', c.lepMax], ['Initiative', c.initiative], ['Panzer', c.panzerwert],
     ['Aktionsp.', c.apBasis], ['Coups', c.coupsBasis], ['Ideen', c.ideenBasis]].forEach(p => {
      b += '<div><div class="lbl">' + esc(p[0]) + '</div><div class="val">' + p[1] + '</div></div>';
    });
    b += '</div>';
    if (c.ideenHinweis) b += '<p class="klein" style="margin:12px 0 0;font-style:italic">Ideen: ' + esc(c.ideenHinweis) + '</p>';
    b += zierleiste(true);
    b += '<h3 class="karte-kopf" style="border:none;padding:0;margin-bottom:6px">Was ich gelernt habe</h3>';
    (c.fertigkeiten || []).forEach(f => {
      b += '<div class="fert"><span class="fert-name">' + esc(f.name) +
           (f.erkl ? '<span>' + esc(f.erkl) + '</span>' : '') + '</span>';
      b += '<span class="fert-fw">' + f.fw + '</span>';
      b += '<span class="fert-attr">' + (ATTRIBUTE.find(a => a.id === f.attr) || {}).kurz + '</span>';
      b += '<span class="fert-sum">' + summe(c, f) + '</span></div>';
    });
    if (c.aufstiegsnotizen && c.aufstiegsnotizen.length) {
      b += '<div class="hinweisfeld"><b>Aufstiege</b><br>' + c.aufstiegsnotizen.map(esc).join('<br>') + '</div>';
    }
    html += karte({ nr: nr(), titel: 'Der Bogen', inhalt: b });

    if (c.kraefte && c.kraefte.length) {
      let k = '';
      c.kraefte.forEach(x => {
        k += '<div class="einfluss"><div class="res-name">' + esc(x.name) +
             (x.ap ? ' <span class="h-ap">' + x.ap + ' Ap</span>' : '') + '</div>';
        if (x.kurz) k += '<div class="res-satz">' + esc(x.kurz) + '</div>';
        if (x.text) k += '<p class="klein" style="margin:5px 0 0">' + esc(x.text) + '</p>';
        k += '</div>';
      });
      html += karte({ nr: nr(), titel: 'Jägerkräfte', inhalt: k });
    }

    html += karte({ nr: nr(), titel: 'Kasse',
                    rechts: c.unterhalt ? 'Unterhalt ' + geldText(c.unterhalt) : null,
                    inhalt: kasseInhalt(c, z) });

    html += karte({ nr: nr(), titel: 'Merkbuch', inhalt: merkbuchInhalt(c, z) });

    let d = '<p class="klein" style="margin:0 0 10px">Eine A4-Seite mit allen Werten und ' +

            '<b>„Als PDF speichern“</b> — dann liegt der Bogen als Datei vor dir.</p>';
    d += '<button class="knopf haupt" id="druckKnopf">Charakterbogen drucken' +
         '<span class="unter">eine Seite · leer oder mit Spielstand</span></button>';

let BlattZustand = {};

function blattOeffnen(html, aufbau) {
  $('#blattInhalt').innerHTML = html;
  $('#blattHg').classList.add('offen');
  document.body.style.overflow = 'hidden';
  if (aufbau) aufbau();
}
function blattSchliessen() {
  $('#blattHg').classList.remove('offen');
  document.body.style.overflow = '';
  BlattZustand = {};
}
function blattKopf(titel, unter) {
  return '<div class="blatt-griff"></div><h2>' + esc(titel) + '</h2>' +
         (unter ? '<div class="untertitel">' + esc(unter) + '</div>' : '') +
         '<div class="blatt-zier">' + ORNAMENT.kopfstueck + '</div>';
}

function blattHandlung(schluessel) {
  const c = charakter(), z = zustand();
  const h = handlungsliste(c, z).find(x => x.schluessel === schluessel);
  if (!h) return;
  BlattZustand = { handlung: h, rabatt: false, gewuerfelt: false, erfolge: 0, zielPanzer: 0 };
  blattHandlungZeichnen();
}

function blattHandlungZeichnen() {
  const c = charakter(), z = zustand();
  const h = BlattZustand.handlung;
  const malus = probenMalus(z);
  const kosten = apKosten(c, z, h, BlattZustand.rabatt);
  let html = blattKopf(h.name, h.hinweis || h.kurz || '');

  if (h.wuerfel != null) {
    html += '<div class="wurf">';
    html += '<div class="wurf-zahl">' + h.wuerfel + '</div>';
    html += '<div class="wurf-was">grüne Würfel</div>';
    let mod = [];
    if (malus > 0) mod.push('<span class="minus">Malus −' + malus + '</span> durch Einflussstufen');
    if (BlattZustand.fokus) mod.push('<span class="plus">Bonus +' + REGELN.probe.fokusBonus + '</span> durch Fokussieren');
    if (mod.length) html += '<div class="wurf-mod">' + mod.join(' · ') + '</div>';
    else html += '<div class="wurf-mod klein">Kein Bonus, kein Malus.</div>';
    html += '</div>';
  }

  if (!BlattZustand.gewuerfelt) {
    if (h.probe) {
      html += '<div class="knopf-reihe" style="margin-bottom:10px">';
      html += '<button class="knopf schmal" data-blatt="fokus-coups"' +
              (z.coups < 1 || BlattZustand.fokus ? ' disabled' : '') + '>Fokussieren<span class="unter">1 Coup · +3</span></button>';
      html += '<button class="knopf schmal" data-blatt="fokus-ideen"' +
              (z.ideen < 1 || BlattZustand.fokus ? ' disabled' : '') + '>Fokussieren<span class="unter">1 Idee · +3</span></button>';
      html += '</div>';
    }

    if (h.rabattMoeglich) {
      html += '<button class="wahl' + (BlattZustand.rabatt ? ' gewaehlt' : '') + '" data-blatt="rabatt">';
      html += '<span class="wahl-zeichen"><span class="wahl-kasten">' +
              (BlattZustand.rabatt ? orn('haken') : '') + '</span></span>';
      html += '<span class="wahl-text"><span class="wahl-titel">' + esc(h.rabattMoeglich.name) + ' nutzen</span>';
      html += '<span class="wahl-unter">' + esc(h.rabattMoeglich.kurz) + '</span></span></button>';
    }

    if (h.kosten) {
      const fehlt = Object.entries(h.kosten).some(([k, v]) => z[k] < v);
      html += '<div class="hinweisfeld' + (fehlt ? ' blut' : '') + '">Kostet zusätzlich ' +
              Object.entries(h.kosten).map(([k, v]) => v + ' ' + k).join(', ') +
              (fehlt ? ' — <b>dafür reicht es nicht.</b>' : '') + '</div>';
    }

    const zuTeuer = kosten > z.ap;
    const ressourceFehlt = h.kosten && Object.entries(h.kosten).some(([k, v]) => z[k] < v);
    html += '<button class="knopf haupt" data-blatt="ausfuehren"' + (zuTeuer || ressourceFehlt ? ' disabled' : '') + '>';
    html += (kosten === 0 ? 'Ausführen — kostenlos' : 'Ausführen — ' + kosten + ' Ap');
    html += '<span class="unter">' + (zuTeuer ? 'Du hast nur ' + z.ap + ' Ap übrig' : 'übrig danach: ' + (z.ap - kosten) + ' Ap') + '</span></button>';
    html += '<div style="height:9px"></div>';
    html += '<button class="knopf schmal" data-blatt="zu">Abbrechen</button>';

  } else {
    if (h.schaden != null) {
      const schaden = schadenAusteilen(BlattZustand.erfolge, h.schaden, BlattZustand.zielPanzer);
      html += '<div class="feld"><label>Wie viele Erfolge hast du gewürfelt?</label></div>';
      html += '<div class="waehler">';
      html += '<button class="tipp-knopf" data-blatt="erfolge--">−</button>';
      html += '<span class="wert">' + BlattZustand.erfolge + '</span>';
      html += '<button class="tipp-knopf" data-blatt="erfolge++">+</button>';
      html += '</div>';
      html += '<div class="feld"><label>Panzerwert des Gegners (fragt die Spielleitung)</label></div>';
      html += '<div class="waehler">';
      html += '<button class="tipp-knopf" data-blatt="panzer--">−</button>';
      html += '<span class="wert">' + BlattZustand.zielPanzer + '</span>';
      html += '<button class="tipp-knopf" data-blatt="panzer++">+</button>';
      html += '</div>';
      html += '<div class="wurf blut">';
      html += '<div class="wurf-zahl">' + schaden + '</div>';
      html += '<div class="wurf-was">Schaden</div>';
      html += '<div class="wurf-mod klein">' + BlattZustand.erfolge + ' Erfolge + ' + h.schaden +
              ' Grundschaden − ' + BlattZustand.zielPanzer + ' Panzer</div>';
      html += '</div>';
      if (BlattZustand.erfolge === 0) {
        html += '<div class="hinweisfeld blut"><b>0 Erfolge heißt daneben.</b> Nichts passiert.</div>';
      }
    } else {
      html += '<div class="hinweisfeld">Erledigt. ' + esc(h.hinweis || '') + '</div>';
    }
    html += '<button class="knopf haupt" data-blatt="zu">Fertig</button>';
  }

  blattOeffnen(html);
}

function handlungAusfuehren() {
  const c = charakter(), z = zustand();
  const h = BlattZustand.handlung;
  const kosten = apKosten(c, z, h, BlattZustand.rabatt);

  merken(h.name);
  z.ap = Math.max(0, z.ap - kosten);
  if (h.kosten) for (const [k, v] of Object.entries(h.kosten)) z[k] = Math.max(0, z[k] - v);
  if (BlattZustand.rabatt && h.rabattMoeglich) z.vorteileGenutzt[h.rabattMoeglich.id] = true;
  if (h.puffer) pufferGeben(z, h.puffer);
  if (h.standardId === 'erstehilfe') {
  }
  if (!z.imKampf && (kosten > 0 || h.gruppe === 'angriff')) z.imKampf = true;

  speichern();
  BlattZustand.gewuerfelt = true;
  BlattZustand.erfolge = 0;
  zeichnen();

  if (h.wuerfel != null || h.schaden != null) blattHandlungZeichnen();
  else { blattSchliessen(); melden(h.name + (kosten ? ' · ' + kosten + ' Ap ab' : '')); }
}

    html += '<div class="feld"><label>Erfolge des Gegners</label></div>';
    html += '<div class="waehler">';
    html += '<button class="tipp-knopf" data-blatt="erf--">−</button>';
    html += '<span class="wert">' + b.erfolge + '</span>';
    html += '<button class="tipp-knopf" data-blatt="erf++">+</button>';
    html += '</div>';
    html += '<div class="feld"><label>Grundschaden seiner Waffe</label></div>';
    html += '<div class="waehler">';

    html += '<div class="wurf">';
    html += '<div class="wurf-zahl">' + z.ap + '</div>';
    html += '<div class="wurf-was">Aktionspunkte für Runde ' + z.runde + '</div></div>';
    if (b.protokoll.length) {
      html += '<div class="hinweisfeld"><b>Was passiert ist</b><br>' + b.protokoll.map(esc).join('<br>') + '</div>';
    }
    html += '<button class="knopf haupt" data-blatt="zu">Weiter geht\'s</button>';
    blattOeffnen(html);
    return;
  }

  if (s.art === 'schaden') {
    const ds = ini0Dauerschaden(z);
    html += '<h3 class="karte-kopf">Schaden aus anhaltenden Einflüssen</h3>';
    ds.teile.forEach(t => {
      html += '<div class="res"><div class="res-titel"><div class="res-name">' + esc(t.name) + '</div>' +
              '<div class="res-satz">Stufe ' + t.stufen + ' × 2 Lebenspunkte</div></div>' +
              '<div class="res-zahl"><span class="jetzt" style="color:var(--rot)">−' + t.schaden + '</span></div></div>';
    });
    html += '<div class="wurf blut">';
    html += '<div class="wurf-zahl" style="color:var(--rot)">' + z.lep + ' → ' + (z.lep - ds.summe) + '</div>';
    html += '<div class="wurf-was">Lebenspunkte</div></div>';
    html += '<button class="knopf haupt" data-blatt="ini0-schaden">' + ds.summe + ' Lebenspunkte abziehen</button>';

  } else if (s.art === 'reduzieren') {
    const e = REGELN.einfluesse.find(x => x.id === s.einfluss);
    const stufe = z.einfluss[s.einfluss];
    html += '<h3 class="karte-kopf">' + esc(e.name) + ' abbauen</h3>';
    html += '<div class="hinweisfeld">Du darfst bei Ini 0 <b>kostenlos</b> eine ' + begriff('Reduzierungsprobe') +
            ' würfeln. Pro Erfolg geht eine Stufe weg. Ein Freund kann helfen — ihn kostet das 2 Ap.</div>';
    html += '<div class="gross-zahl rot">Stufe ' + stufe + '</div>';
    html += '<div class="feld" style="margin-top:14px"><label>Wie viele Erfolge hattest du?</label></div>';
    html += '<div class="waehler">';
    html += '<button class="tipp-knopf" data-blatt="ini0-erf--">−</button>';
    html += '<span class="wert">' + b.erfolge + '</span>';
    html += '<button class="tipp-knopf" data-blatt="ini0-erf++">+</button>';
    html += '</div>';
    const neu = Math.max(0, stufe - b.erfolge);
    html += '<div class="wurf">';
    html += '<div class="wurf-zahl">Stufe ' + neu + '</div>';
    html += '<div class="wurf-was">danach</div></div>';
    html += '<button class="knopf haupt" data-blatt="ini0-reduzieren">Übernehmen</button>';
    html += '<div style="height:9px"></div>';
    html += '<button class="knopf schmal" data-blatt="ini0-weiter">Nicht gewürfelt — überspringen</button>';

  } else if (s.art === 'auffuellen') {
    const max = apMax(c, z);
    html += '<h3 class="karte-kopf">Aktionspunkte auffüllen</h3>';
    html += '<div class="wurf">';
    html += '<div class="wurf-zahl" style="color:var(--ap)">' + z.ap + ' → ' + max + '</div>';
    html += '<div class="wurf-was">Aktionspunkte</div>';
    if (z.einfluss.laehmung > 0) {
      html += '<div class="wurf-mod"><span class="minus">−' + z.einfluss.laehmung + '</span> durch Lähmungsstufen</div>';
    }
    html += '</div>';
    html += '<button class="knopf haupt" data-blatt="ini0-auffuellen">Auffüllen und Runde ' + (z.runde + 1) + ' beginnen</button>';
  }

  blattOeffnen(html);
}

  const ziel = document.getElementById('druckVorschau');
  if (!ziel) return;
  druckAufbauen(mitStand);                     /* echter Aufbau samt Anpassung */
  const quelle = document.querySelector('#druckbogen .db-seite');
  if (!quelle) return;
  ziel.innerHTML = '<div class="dv-rahmen">' + quelle.outerHTML + '</div>';
  delete document.documentElement.dataset.drucken;
  const rahmen = ziel.querySelector('.dv-rahmen');
  const seite = ziel.querySelector('.db-seite');
  const breite = ziel.getBoundingClientRect().width;
  const f = breite / seite.getBoundingClientRect().width;
  seite.style.transformOrigin = 'top left';
  seite.style.transform = 'scale(' + f + ')';
  rahmen.style.height = (seite.getBoundingClientRect().height) + 'px';
}

const DB_SEITE_H = 283;   /* mm */
const DB_SEITE_B = 196;   /* mm */

function betont(text) {
  return esc(text || '').replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
}

function dbKaestchen(anzahl, genutzt) {
  let h = '';
  for (let i = 1; i <= anzahl; i++) {
    h += '<span class="dk' + (i <= genutzt ? ' weg' : '') + '"></span>';
  }
  return h;
}

function dbKraftgruppen(c) {
  const gruppen = [];
  (c.kraefte || []).forEach(k => {
    const teile = k.name.split(' — ');
    const name = teile[0];
    const unter = teile.length > 1 ? teile[1] : null;
    let g = gruppen.find(x => x.name === name);
    if (!g) {
      g = { name: name, label: k.label || (k.ap ? k.ap + ' Ap' : ''), zeilen: [] };
      gruppen.push(g);
    }
    if (!g.label && k.label) g.label = k.label;
    const satz = (unter ? '<b>' + esc(unter) + ':</b> ' : '') + betont(k.kurz || '');
    g.zeilen.push(satz);
    if (!unter && k.text) g.zeilen.push(betont(k.text));
  });
  return gruppen;
}

function druckAnpassen() {
  const seite = document.querySelector('.db-seite');
  const blatt = document.querySelector('.db-blatt');
  if (!blatt || !seite) return 1;
  blatt.style.transform = '';
  blatt.style.width = '';
  const proMm = seite.getBoundingClientRect().height / DB_SEITE_H;
  const hoehe = blatt.scrollHeight / proMm;
  if (hoehe <= DB_SEITE_H) return 1;
  const faktor = Math.max(0.62, (DB_SEITE_H - 0.6) / hoehe);
  blatt.style.transform = 'scale(' + faktor + ')';
  blatt.style.width = ((100 / faktor) - 0.7) + '%';
  return faktor;
}

let BogenschriftVersprechen = null;

function bogenschriftLaden() {
  if (BogenschriftVersprechen) return BogenschriftVersprechen;
  if (!document.fonts || !document.fonts.load) {
    BogenschriftVersprechen = Promise.resolve(false);
    return BogenschriftVersprechen;
  }
  BogenschriftVersprechen = Promise.all([
    document.fonts.load('400 10pt Bogenschrift'),
    document.fonts.load('700 10pt Bogenschrift'),
    document.fonts.load('italic 400 10pt Bogenschrift')
  ]).then(() => document.fonts.ready).then(() => bogenschriftDa())
    .catch(() => false);
  return BogenschriftVersprechen;
}

function bogenschriftDa() {
  try { return !!(document.fonts && document.fonts.check('10pt Bogenschrift')); }
  catch (e) { return true; }
}

function bogenDateiBauen(mitStand) {
  const alleRegeln = Array.from(document.styleSheets[0].cssRules)
    .map(r => r.cssText);
  const schrift = alleRegeln.filter(r => r.indexOf("Bogenschrift") >= 0).join('\n');
  const druck = alleRegeln.filter(r =>
    /^\s*(\.db-|\.dk|\.lz|\.pz|\.fw|\.fa|\.fs|#druckbogen|@page|html\[data-drucken\])/.test(r)
  ).join('\n');
  const bogen = druckbogenBauen(mitStand);
  const c = charakter();
  return '<!DOCTYPE html>\n<html lang="de"><head><meta charset="utf-8">' +
    '<title>Jägerbogen — ' + esc(c.name) + '</title>' +
    '<style>\n' + schrift + '\n' + druck +
    '\nhtml,body{margin:0;padding:0;background:#e8e2d4}' +
    '\n#druckbogen{display:block}' +
    '\n@media screen{.db-seite{margin:8mm auto;box-shadow:0 4px 24px rgba(0,0,0,.25)}}' +
    '\n@media print{body{background:#fff}.db-seite{margin:0 auto;box-shadow:none}}' +
    '\n</style></head><body><div id="druckbogen">' + bogen + '</div></body></html>';
}

function bogenDateiSpeichern(mitStand) {
  const c = charakter();
  const html = bogenDateiBauen(mitStand);
  const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'jaegerbogen-' + (c.beiname || c.name).toLowerCase().replace(/[^a-z0-9]+/g, '-') +
               '-stufe' + c.stufe + (mitStand ? '-stand' : '') + '.html';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  melden('Bogen als Datei gespeichert.');
}

function druckAufbauen(mitStand) {
  document.getElementById('druckbogen').innerHTML = druckbogenBauen(mitStand);
  document.documentElement.dataset.drucken = '1';
  return druckAnpassen();
}

function druckStarten(mitStand) {
  bogenschriftLaden().then(() => {
    blattSchliessen();
    druckAufbauen(mitStand);
    requestAnimationFrame(() => requestAnimationFrame(() => {
      druckAnpassen();
      setTimeout(() => {
        window.print();
        setTimeout(() => { delete document.documentElement.dataset.drucken; }, 600);
      }, 60);
    }));
  });
}

function begriffZeigen(knopf) {
  const wort = knopf.dataset.begriff;
  const text = REGELN.glossar[wort];
  if (!text) return;
  const blase = $('#tippBlase');
  blase.innerHTML = '<b>' + esc(wort) + '</b>' + esc(text);
  blase.classList.add('offen');
  const r = knopf.getBoundingClientRect();
  const bb = blase.getBoundingClientRect();
  let links = r.left + r.width / 2 - bb.width / 2;
  links = Math.max(10, Math.min(links, window.innerWidth - bb.width - 10));
  let oben = r.top - bb.height - 10;
  if (oben < 10) oben = r.bottom + 10;
  blase.style.left = links + 'px';
  blase.style.top = oben + 'px';
}
function begriffSchliessen() { $('#tippBlase').classList.remove('offen'); }

function modusSetzen(m) {
  Buch.einstellungen.modus = m;

  speichern();
}
