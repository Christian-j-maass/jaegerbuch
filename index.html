function exportieren() {
  Buch.einstellungen.letzteSicherung = Date.now();
  speichern();
  const daten = JSON.stringify(Buch, null, 2);
  const blob = new Blob([daten], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date();
  const stempel = d.getFullYear() + '-' +
    String(d.getMonth() + 1).padStart(2, '0') + '-' +
    String(d.getDate()).padStart(2, '0');
  a.href = url;
  a.download = 'jaegerbuch-' + stempel + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  zeichnen();
  melden('Sicherung erstellt.');
}

function importieren(datei) {
  const leser = new FileReader();
  leser.onload = () => {
    try {
      const daten = JSON.parse(leser.result);
      if (!daten || !Array.isArray(daten.charaktere)) throw new Error('Kein Jägerbuch');
      Buch = Object.assign({ einstellungen: { modus: 'dunkel' } }, daten);
      alleErgaenzen();          /* Jäger aus einer älteren Fassung nachrüsten */
      RueckStapel = [];
      modusSetzen(Buch.einstellungen.modus || 'dunkel');
      zierratSetzen(Buch.einstellungen.zierrat || 'voll');
      speichern();
      zeichnen();
      melden(Buch.charaktere.length + ' Jäger eingelesen.');
    } catch (e) {
      melden('Das war keine Jägerbuch-Sicherung.');
    }
  };
  leser.readAsText(datei);
}

function vorlageLaden(id) {
  const v = VORLAGEN.find(x => x.id === id);
  if (!v) return;
  const c = v.bauen();
  let nr = 1;
  while (Buch.charaktere.some(x => x.id === c.id)) { c.id = v.id + '-' + (++nr); }
  Buch.charaktere.push(c);
  Buch.zustaende[c.id] = neuerZustand(c);
  Buch.aktiv = c.id;
  RueckStapel = [];
  speichern();
  blattSchliessen();
  seiteZeigen('marker');
  melden(c.name + ' ist bereit.');
}

document.addEventListener('click', ev => {
  const t = ev.target;

  const b = t.closest('.begriff');
  if (b) { ev.stopPropagation(); begriffZeigen(b); return; }
  begriffSchliessen();

  if (t.closest('#undoKnopf')) { zurueck(); return; }
  if (t.closest('#modusKopf')) {
    modusSetzen(Buch.einstellungen.modus === 'dunkel' ? 'hell' : 'dunkel');
    zeichnen(); return;
  }

  const reiter = t.closest('.reiter-knopf');
  if (reiter) { seiteZeigen(reiter.dataset.seite); return; }

  if (t.id === 'blattHg') { blattSchliessen(); return; }

  const resK = t.closest('[data-res]');
  if (resK && !resK.disabled) {
    const id = resK.dataset.res, delta = parseInt(resK.dataset.delta, 10);
    const c = charakter(), z = zustand();
    const max = resMax(c, z, id);
    const r = REGELN.ressourcen.find(x => x.id === id);
    aendern(r.name + (delta > 0 ? ' +1' : ' −1'), (z) => {
      z[id] = Math.max(0, Math.min(max, z[id] + delta));
      if (id === 'ap' && delta < 0) z.imKampf = true;
    });
    return;
  }

  const fok = t.closest('[data-fokus]');
  if (fok && !fok.disabled) {
    const id = fok.dataset.fokus;
    aendern('Fokussieren', (z) => { z[id] = Math.max(0, z[id] - 1); });
    melden('Fokussiert — Bonus +' + REGELN.probe.fokusBonus + ' auf die Probe.');
    return;
  }

  const lepK = t.closest('[data-lep]');
  if (lepK) {
    const d = parseInt(lepK.dataset.lep, 10);
    aendern('Lebenspunkte ' + (d > 0 ? '+1' : '−1'), (z, c) => {
      z.lep = Math.max(-30, Math.min(c.lepMax, z.lep + d));
      if (istVerletzt(z)) z.puffer = 0;
    });
    return;
  }
  const lepFeld = t.closest('[data-lepwert]');
  if (lepFeld) {
    const v = parseInt(lepFeld.dataset.lepwert, 10);
    aendern('Lebenspunkte auf ' + v, (z) => {
      z.lep = v;
      if (istVerletzt(z)) z.puffer = 0;
    });
    return;
  }
  const pufK = t.closest('[data-puffer]');
  if (pufK && !pufK.disabled) {
    const d = parseInt(pufK.dataset.puffer, 10);
    aendern('Puffer ' + (d > 0 ? '+1' : '−1'), (z) => {
      if (d > 0) { const r = pufferGeben(z, 1); if (!r.erlaubt) melden(r.grund); }
      else z.puffer = Math.max(0, z.puffer - 1);
    });
    return;
  }
  const kast = t.closest('[data-kaestchen]');
  if (kast) {
    const feld = kast.dataset.kaestchen + 'Genutzt';
    const nr = parseInt(kast.dataset.nr, 10);
    aendern('Heilungskästchen', (z) => {
      z[feld] = (z[feld] >= nr) ? nr - 1 : nr;
    });
    return;
  }
  if (t.closest('#trefferKnopf')) { blattTreffer(); return; }
  if (t.closest('#heilenKnopf')) { blattHeilen(); return; }

  const hand = t.closest('[data-handlung]');
  if (hand && !hand.disabled) { blattHandlung(hand.dataset.handlung); return; }
  if (t.closest('#rundeFertig') || t.closest('#ini0Start')) { blattIni0(); return; }

  const einf = t.closest('[data-einfluss]');
  if (einf) {
    const id = einf.dataset.einfluss;
    const s = parseInt(einf.dataset.stufe, 10);
    const e = REGELN.einfluesse.find(x => x.id === id);
    aendern(e.name + ' Stufe ' + s, (z, c) => {
      z.einfluss[id] = (z.einfluss[id] === s && s > 0) ? s - 1 : s;
      if (id === 'laehmung') z.ap = Math.min(z.ap, apMax(c, z));
    });
    return;
  }
  if (t.closest('#kampfStart')) {
    aendern('Kampf begonnen', (z, c) => {
      z.imKampf = true; z.runde = 1;
      z.ap = apMax(c, z);
      z.vorteileGenutzt = {};
      (c.kraefte || []).forEach(k => { if (k.kampfbeginn && k.puffer) pufferGeben(z, k.puffer); });
    });
    melden('Kampf läuft. Runde 1.');
    return;
  }
  if (t.closest('#kampfEnde')) {
    aendern('Kampf beendet', (z, c) => nachKampf(c, z));
    melden('Coups und Ideen sind wieder voll.');
    return;
  }
  if (t.closest('#nachtruheKnopf')) { blattNachtruhe(); return; }
  if (t.closest('#allesZurueck')) {
    if (!confirm('Alle Zähler dieses Jägers auf Anfang zurücksetzen?')) return;
    aendern('Alles zurückgesetzt', (z, c) => Object.assign(z, neuerZustand(c)));
    return;
  }

  const jw = t.closest('[data-jaeger]');
  if (jw) {
    Buch.aktiv = jw.dataset.jaeger;
    RueckStapel = [];
    speichern(); zeichnen();
    melden('Gewechselt zu ' + charakter().name + '.');
    return;
  }
  if (t.closest('#vorlageKnopf')) { blattVorlagen(); return; }
  if (t.closest('#neuKnopf')) { blattEditor(true); return; }
  if (t.closest('#bearbeitenKnopf')) { blattEditor(false); return; }
  if (t.closest('#loeschenKnopf')) {
    const c = charakter();
    if (!c) return;
    if (!confirm('„' + c.name + '“ wirklich löschen? Das lässt sich nicht rückgängig machen.')) return;
    Buch.charaktere = Buch.charaktere.filter(x => x.id !== c.id);
    delete Buch.zustaende[c.id];
    Buch.aktiv = Buch.charaktere.length ? Buch.charaktere[0].id : null;
    RueckStapel = [];
    speichern(); zeichnen();
    melden('Gelöscht.');
    return;
  }
  if (t.closest('#exportKnopf')) { exportieren(); return; }
  if (t.closest('#importKnopf')) { $('#importDatei').click(); return; }
  if (t.closest('#modusKnopf')) {
    modusSetzen(Buch.einstellungen.modus === 'dunkel' ? 'hell' : 'dunkel');
    zeichnen(); return;
  }
  if (t.closest('#tbAuf')) { titelblattSchliessen(); return; }
  if (t.closest('#spielhinweisKnopf')) { blattSpielhinweis(); return; }
  if (t.closest('#druckKnopf')) { blattDrucken(false); return; }

  const ka = t.closest('[data-kasse]');
  if (ka) {
    const was = ka.dataset.kasse;
    if (was === 'ein' || was === 'aus') { blattBuchen(was); return; }
    if (was === 'alle') { blattKasseAlle(); return; }
    if (was === 'unterhalt') {
      const c = charakter();
      aendern('Unterhalt gezahlt', (z) => buchen(z, -c.unterhalt, 'Unterhalt'));
      melden(geldText(charakter().unterhalt) + ' ' + (charakter().waehrung || 'Gulden') + ' Unterhalt gezahlt.');
      return;
    }
  }
  const bw = t.closest('[data-buchungweg]');
  if (bw) {
    const i = parseInt(bw.dataset.buchungweg, 10);
    aendern('Buchung zurückgenommen', (z) => { z.buchungen.splice(i, 1); });
    if ($('#blattHg').classList.contains('offen')) blattKasseAlle();
    return;
  }

  const nz = t.closest('[data-notiz]');
  if (nz) {
    if (nz.dataset.notiz === 'neu') { blattNotiz(null); return; }
    if (nz.dataset.notiz === 'alle') { blattNotizenAlle(); return; }
  }
  const nw = t.closest('[data-notizweg]');
  if (nw) {
    const i = parseInt(nw.dataset.notizweg, 10);
    aendern('Notiz gelöscht', (z) => { z.logbuch.splice(i, 1); });
    if ($('#blattHg').classList.contains('offen')) blattNotizenAlle();
    return;
  }
  const nb = t.closest('[data-notizbearbeiten]');
  if (nb) { blattNotiz(parseInt(nb.dataset.notizbearbeiten, 10)); return; }
  if (t.closest('#titelKnopf')) { titelblattZeigen(); return; }
  if (t.closest('#zierratKnopf')) {
    zierratSetzen(Buch.einstellungen.zierrat === 'schlicht' ? 'voll' : 'schlicht');
    zeichnen();
    melden(Buch.einstellungen.zierrat === 'schlicht' ? 'Schlichte Darstellung.' : 'Zierrat zurück.');
    return;
  }
  if (t.closest('#hilfeKnopf')) { blattHilfe(); return; }
  if (t.closest('#kaffeeKnopf')) {
    const f = window.open(kaffeeLink(), '_blank', 'noopener,noreferrer');
    if (!f) melden('Der Browser hat das Fenster blockiert. Bitte PayPal von Hand öffnen.');
    return;
  }

  const ba = t.closest('[data-blatt]');
  if (ba && !ba.disabled) { blattAktion(ba.dataset.blatt); return; }

  const wb = t.closest('[data-wbesitz]');
  if (wb) {
    const i = parseInt(wb.dataset.wbesitz, 10);
    BlattZustand.entwurf.waffen[i].besitz = !BlattZustand.entwurf.waffen[i].besitz;
    editorFelderLesen();
    blattEditorZeichnen();
    return;
  }
});

function editorFelderLesen() {
  const c = BlattZustand.entwurf;
  if (!c) return;
  $$('[data-ed]').forEach(f => {
    const k = f.dataset.ed;
    if (f.type === 'number') {
      const roh = parseFloat(String(f.value).replace(',', '.'));
      c[k] = isNaN(roh) ? 0 : (k === 'geldStart' || k === 'unterhalt' ? roh : Math.round(roh));
    } else {
      c[k] = f.value;
    }
  });
  $$('[data-attr]').forEach(f => { c.attribute[f.dataset.attr] = parseInt(f.value, 10) || 0; });
  $$('[data-fert]').forEach(f => { c.fertigkeiten[parseInt(f.dataset.fert, 10)].fw = parseInt(f.value, 10) || 0; });
  $$('[data-waffe]').forEach(f => { c.waffen[parseInt(f.dataset.waffe, 10)].fw = parseInt(f.value, 10) || 0; });
  const pk = REGELN.panzerklassen.find(p => p.id === c.panzerklasse);
  if (pk) c.apBasis = pk.ap;
}

let MerkUhr = null;
document.addEventListener('input', ev => {
  if (ev.target.id === 'merkzettel') {
    clearTimeout(MerkUhr);
    MerkUhr = setTimeout(() => {
      const z = zustand();
      if (z) { z.merkzettel = ev.target.value; speichern(); }
    }, 400);
  }
});

document.addEventListener('change', ev => {
  if (ev.target.id === 'importDatei' && ev.target.files.length) {
    importieren(ev.target.files[0]);
    ev.target.value = '';
    return;
  }
  if (ev.target.closest('#blattInhalt') && BlattZustand.entwurf) {
    editorFelderLesen();
    if (ev.target.dataset.attr || ev.target.dataset.fert || ev.target.dataset.waffe) blattEditorZeichnen();
  }
});

function blattAktion(code) {
  const c = charakter(), z = zustand(), b = BlattZustand;

  if (code === 'zu') { blattSchliessen(); zeichnen(); return; }

  if (code === 'fokus-coups' || code === 'fokus-ideen') {
    const id = code.split('-')[1];
    merken('Fokussieren');
    z[id] = Math.max(0, z[id] - 1);
    b.fokus = id;
    speichern(); zeichnen(); blattHandlungZeichnen();
    return;
  }
  if (code === 'rabatt') { b.rabatt = !b.rabatt; blattHandlungZeichnen(); return; }
  if (code === 'ausfuehren') { handlungAusfuehren(); return; }
  if (code === 'erfolge++') { b.erfolge++; blattHandlungZeichnen(); return; }
  if (code === 'erfolge--') { b.erfolge = Math.max(0, b.erfolge - 1); blattHandlungZeichnen(); return; }
  if (code === 'panzer++') { b.zielPanzer++; blattHandlungZeichnen(); return; }
  if (code === 'panzer--') { b.zielPanzer = Math.max(0, b.zielPanzer - 1); blattHandlungZeichnen(); return; }

  if (code === 'modus-direkt') { b.modus = 'direkt'; blattTrefferZeichnen(); return; }
  if (code === 'modus-rechnen') { b.modus = 'rechnen'; blattTrefferZeichnen(); return; }
  if (code === 'sch++') { b.schaden++; blattTrefferZeichnen(); return; }
  if (code === 'sch--') { b.schaden = Math.max(0, b.schaden - 1); blattTrefferZeichnen(); return; }
  if (code.startsWith('sch=')) { b.schaden = parseInt(code.slice(4), 10); blattTrefferZeichnen(); return; }
  if (code === 'erf++') { b.erfolge++; blattTrefferZeichnen(); return; }
  if (code === 'erf--') { b.erfolge = Math.max(0, b.erfolge - 1); blattTrefferZeichnen(); return; }
  if (code === 'wsch++') { b.waffenschaden++; blattTrefferZeichnen(); return; }
  if (code === 'wsch--') { b.waffenschaden = Math.max(0, b.waffenschaden - 1); blattTrefferZeichnen(); return; }
  if (code.startsWith('art-')) { b.art = code.slice(4); blattTrefferZeichnen(); return; }
  if (code === 'treffer-ok') {
    const roh = b.modus === 'direkt' ? b.schaden : Math.max(0, b.erfolge + b.waffenschaden);
    merken('Treffer ' + roh);
    const bericht = schadenVerrechnen(c, z, roh, b.art);
    speichern(); zeichnen(); blattSchliessen();
    melden(bericht.lep + ' Lebenspunkte weg' + (bericht.panzer ? ' (Panzer fing ' + bericht.panzer + ' ab)' : '') + '.');
    return;
  }

  if (code.startsWith('weg-')) { b.weg = code.slice(4); b.menge = 1; blattHeilenZeichnen(); return; }
  if (code === 'menge++') { b.menge++; blattHeilenZeichnen(); return; }
  if (code === 'menge--') { b.menge = Math.max(0, b.menge - 1); blattHeilenZeichnen(); return; }
  if (code === 'heilen-ok') {
    merken('Heilung');
    z.lep = Math.min(c.lepMax, z.lep + b.menge);
    if (b.weg === 'erste') z.ersteHilfeGenutzt = Math.min(c.ersteHilfeMax, z.ersteHilfeGenutzt + 1);
    if (b.weg === 'magie') z.magHeilungGenutzt = Math.min(c.magHeilungMax, z.magHeilungGenutzt + 1);
    if (b.weg === 'rage') z.rage = Math.max(0, z.rage - 1);
    speichern(); zeichnen(); blattSchliessen();
    melden('+' + b.menge + ' Lebenspunkte.');
    return;
  }

  if (code === 'ini0-schaden') {
    const ds = ini0Dauerschaden(z);
    z.lep -= ds.summe;
    if (istVerletzt(z)) z.puffer = 0;
    b.protokoll.push(ds.summe + ' Lebenspunkte durch anhaltende Einflüsse');
    speichern(); zeichnen(); ini0Weiter();
    return;
  }
  if (code === 'ini0-erf++') { b.erfolge++; blattIni0Zeichnen(); return; }
  if (code === 'ini0-erf--') { b.erfolge = Math.max(0, b.erfolge - 1); blattIni0Zeichnen(); return; }
  if (code === 'ini0-reduzieren') {
    const s = b.schritte[b.nr];
    const e = REGELN.einfluesse.find(x => x.id === s.einfluss);
    const vorher = z.einfluss[s.einfluss];
    z.einfluss[s.einfluss] = Math.max(0, vorher - b.erfolge);
    if (b.erfolge > 0) b.protokoll.push(e.name + ': Stufe ' + vorher + ' → ' + z.einfluss[s.einfluss]);
    speichern(); zeichnen(); ini0Weiter();
    return;
  }
  if (code === 'ini0-weiter') { ini0Weiter(); return; }
  if (code === 'ini0-auffuellen') {
    apAuffuellen(c, z);
    z.runde++;
    z.imKampf = true;
    b.protokoll.push('Aktionspunkte auf ' + z.ap + ' aufgefüllt · Runde ' + z.runde + ' beginnt');
    speichern(); zeichnen(); ini0Weiter();
    return;
  }

  if (code.startsWith('vorlage-')) { vorlageLaden(code.slice(8)); return; }
  if (code === 'ed-speichern') {
    editorFelderLesen();
    const e = b.entwurf;
    if (!e.name.trim()) { melden('Der Jäger braucht einen Namen.'); return; }
    if (b.neu) {
      Buch.charaktere.push(e);
      Buch.zustaende[e.id] = neuerZustand(e);
      Buch.aktiv = e.id;
    } else {
      const i = Buch.charaktere.findIndex(x => x.id === e.id);
      if (i >= 0) Buch.charaktere[i] = e;
      const z2 = Buch.zustaende[e.id];
      if (z2) {
        z2.lep = Math.min(z2.lep, e.lepMax);
        z2.ap = Math.min(z2.ap, apMax(e, z2));
        z2.coups = Math.min(z2.coups, e.coupsBasis + 3);
        z2.ideen = Math.min(z2.ideen, e.ideenBasis + 3);
      }
    }
    RueckStapel = [];
    speichern(); blattSchliessen(); zeichnen();
    melden('Gespeichert.');
    return;
  }

  if (code === 'bu++') { b.betrag = Math.round((b.betrag + 1) * 100) / 100; blattBuchenZeichnen(); return; }
  if (code === 'bu--') { b.betrag = Math.max(0, Math.round((b.betrag - 1) * 100) / 100); blattBuchenZeichnen(); return; }
  if (code.startsWith('bu+') && code.length > 3) {
    const f = $('#buBetrag'), g = $('#buGrund');
    if (f) b.betrag = Math.abs(parseFloat(f.value.replace(',', '.')) || 0);
    if (g) b.grund = g.value;
    b.betrag = Math.round((b.betrag + parseFloat(code.slice(3))) * 100) / 100;
    blattBuchenZeichnen(); return;
  }
  if (code.startsWith('grund-')) {
    const feld = $('#buGrund');
    b.grund = code.slice(6);
    if (feld) feld.value = b.grund;
    return;
  }
  if (code === 'bu-ok') {
    const fb = $('#buBetrag'), fg = $('#buGrund');
    const betrag = fb ? Math.abs(parseFloat(String(fb.value).replace(',', '.')) || 0) : b.betrag;
    const grund = (fg && fg.value.trim()) || b.grund || (b.art === 'ein' ? 'Einnahme' : 'Ausgabe');
    if (betrag <= 0) { melden('Der Betrag fehlt.'); return; }
    merken(b.art === 'ein' ? 'Einnahme' : 'Ausgabe');
    buchen(z, b.art === 'ein' ? betrag : -betrag, grund);
    speichern(); zeichnen(); blattSchliessen();
    melden((b.art === 'ein' ? '+' : '\u2212') + geldText(betrag) + ' ' + (c.waehrung || 'Gulden') + ' · ' + grund);
    return;
  }

  if (code === 'notiz-ok') {
    const f = $('#notizText');
    const text = f ? f.value.trim() : '';
    if (!text) { melden('Die Notiz ist leer.'); return; }
    merken('Notiz');
    if (b.notizIndex != null) z.logbuch[b.notizIndex].x = text;
    else notizAnlegen(z, text);
    speichern(); zeichnen(); blattSchliessen();
    melden('Aufgeschrieben.');
    return;
  }

  if (code === 'druckart-leer')  { blattDrucken(false); return; }
  if (code === 'druckart-stand') { blattDrucken(true); return; }
  if (code === 'druck-los')      { druckStarten(!!b.druckStand); return; }
  if (code === 'druck-datei')    { bogenDateiSpeichern(!!b.druckStand); return; }

  if (code === 'nacht++') { b.lep = Math.min(4, b.lep + 1); blattNachtruheZeichnen(); return; }
  if (code === 'nacht--') { b.lep = Math.max(1, b.lep - 1); blattNachtruheZeichnen(); return; }
  if (code === 'nacht-ok') {
    merken('Nachtruhe');
    nachtruhe(c, z, b.lep);
    speichern(); zeichnen(); blattSchliessen();
    melden('Ausgeruht. Alle Kästchen wieder frei.');
    return;
  }
}

function starten() {
  const speicherOk = speicherVerfuegbar();
  if (speicherOk) laden();

  modusSetzen(Buch.einstellungen.modus || 'dunkel');   /* Kerzenschein ist die Grundfassung */
  zierratSetzen(Buch.einstellungen.zierrat || 'voll');

  if (!Buch.charaktere.length) {
    const c = baueMali(3);
    Buch.charaktere.push(c);
    Buch.zustaende[c.id] = neuerZustand(c);
    Buch.aktiv = c.id;
    if (speicherOk) speichern();
  }
  if (!charakter() && Buch.charaktere.length) Buch.aktiv = Buch.charaktere[0].id;

  zeichnen();

  bogenschriftLaden();

  titelblattZeigen();

  if (!speicherOk) {
    setTimeout(() => melden('Dieser Browser speichert hier nichts. Sichere als Datei!'), 700);
  }
}

document.addEventListener('DOMContentLoaded', starten);

</script>
